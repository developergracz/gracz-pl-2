name: B1-C17-C02 Single 100 VU Verification Control

on:
  push:
    branches:
      - fix/wave-b-b1-c17-c02-checkers-durability-attribution
    paths:
      - '.github/workflows/b1-c17-c02-100vu-control.yml'

permissions:
  contents: read

jobs:
  b1-c17-c02-100vu-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gracz_b1_c17_c02_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gracz_b1_c17_c02_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: modern/checkers-engine
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_b1_c17_c02_control
      WAVE_B_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_b1_c17_c02_control
      POSTGRES_POOL_BUDGET: '64'
      WAVE_B_SEED: '20260909'
      WAVE_B_RUN_ID: b1-c17-c02-r1-v100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify authorized C02 implementation identity and frozen invariants
        run: |
          set -euo pipefail
          test "$(git rev-parse 560e3fcda3d8870e28530e13b02688b52a5267ca^{tree})" = "5714fe0be06719e9a4cc2e605b9c34482975bb68"
          git merge-base --is-ancestor 560e3fcda3d8870e28530e13b02688b52a5267ca HEAD
          git diff --exit-code 560e3fcda3d8870e28530e13b02688b52a5267ca HEAD -- \
            modern/checkers-engine/src \
            modern/checkers-engine/perf/k6/scenarios/_runner.js \
            modern/checkers-engine/test
          grep -q 'function recordCheckersAccepted(res)' perf/k6/scenarios/_runner.js
          grep -q 'body?.duplicate===false' perf/k6/scenarios/_runner.js
          grep -q 'max: 4' src/postgres-session-store.js
          grep -q 'connectionTimeoutMillis: 10_000' src/postgres-session-store.js
          grep -q 'const MAX_BATCH_REQUESTS = 64;' src/distributed-infrastructure.js
          grep -q 'const MAX_BATCH_KEYS = 256;' src/distributed-infrastructure.js
          grep -q 'const MAX_BATCH_WAIT_MS = 4;' src/distributed-infrastructure.js
          grep -q 'const MAX_QUEUE_DEPTH = 512;' src/distributed-infrastructure.js
          grep -q 'const OPERATION_TIMEOUT_MS = 1_500;' src/distributed-infrastructure.js
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Setup k6
        uses: grafana/setup-k6-action@v1
      - name: Generate isolated masked control secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in AUTH_SECRET MESSAGE_ENCRYPTION_KEY ATTACHMENT_ENCRYPTION_KEY MFA_ENCRYPTION_KEY; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Static and focused control preflight
        run: |
          set -euo pipefail
          command -v k6
          command -v psql
          node --check perf/k6/scenarios/_runner.js
          node --test --test-concurrency=1 \
            test/wave-b-b1-c17-c02-checkers-durability-attribution.test.js \
            test/wave-b-b1-c14-per-game-write-counters.test.js \
            test/wave-b-b1-c13-metric-accounting.test.js \
            test/wave-b-b1-c17-lobby-state-client-reuse.test.js \
            test/wave-b-b1-c16-traffic-guard-coalescing.test.js
      - name: Reset isolated PostgreSQL control database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
      - name: Run exactly one B1-C17-C02 100 VU control
        id: control
        continue-on-error: true
        run: |
          set +e
          WAVE_B_REPLICAS=1 \
          WAVE_B_VUS=100 \
          WAVE_B_SCENARIO=mixed-platform \
          WAVE_B_GAME_COUNT=50 \
          WAVE_B_WARMUP_SECONDS=120 \
          WAVE_B_STEADY_SECONDS=300 \
          WAVE_B_COOLDOWN_SECONDS=120 \
          WAVE_B_THINK_SECONDS=0.05 \
          bash perf/scripts/wave-b-runner.sh
          rc=$?
          echo "$rc" > perf/k6/reports/b1-c17-c02-control-exit.txt
          exit "$rc"
      - name: Print correctness evidence
        if: always()
        run: |
          set +e
          node perf/scripts/wave-b-summarize.mjs
          echo '--- CORRECTNESS ---'
          cat perf/k6/reports/b1-c17-c02-r1-v100-correctness.json 2>/dev/null || true
          echo '--- RECORD ---'
          cat perf/k6/reports/b1-c17-c02-r1-v100-record.json 2>/dev/null || true
      - name: Upload B1-C17-C02 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1-c17-c02-100vu-${{ github.sha }}-${{ github.run_id }}
          path: modern/checkers-engine/perf/k6/reports/
          if-no-files-found: error
          retention-days: 30
      - name: Final truthful control gate
        if: always()
        run: |
          if [[ "${{ steps.control.outcome }}" == "success" ]]; then
            echo 'B1-C17-C02 single 100 VU control completed with runner PASS.'
            exit 0
          fi
          echo 'B1-C17-C02 single 100 VU control completed with runner FAIL; evidence preserved.'
          exit 1
