name: P1-U-02 Match Runtime

on:
  pull_request:
    paths:
      - "modern/checkers-engine/src/match-runtime.js"
      - "modern/checkers-engine/src/match-runtime-adapters.js"
      - "modern/checkers-engine/src/postgres-match-lease-coordinator.js"
      - "modern/checkers-engine/test/match-runtime.test.js"
      - "modern/checkers-engine/test/p1-u-02-postgres-ownership.test.js"
      - "modern/checkers-engine/package.json"
      - ".github/workflows/p1-u-02-match-runtime.yml"

permissions:
  contents: read

concurrency:
  group: p1-u-02-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gracz
          POSTGRES_PASSWORD: gracz_test
          POSTGRES_DB: gracz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gracz -d gracz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      P1_U_02_DATABASE_URL: postgresql://gracz:gracz_test@localhost:5432/gracz_test
    defaults:
      run:
        working-directory: modern/checkers-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-fund --no-audit
      - name: Static syntax checks
        run: npm run check
      - name: Common Match Runtime contract and PostgreSQL ownership tests
        run: node --test test/match-runtime.test.js test/p1-u-02-postgres-ownership.test.js
