name: P1-U-02 Match Runtime

on:
  pull_request:
    paths:
      - "modern/checkers-engine/src/match-runtime.js"
      - "modern/checkers-engine/src/match-runtime-adapters.js"
      - "modern/checkers-engine/test/match-runtime.test.js"
      - "modern/checkers-engine/package.json"
      - ".github/workflows/p1-u-02-match-runtime.yml"

permissions:
  contents: read

concurrency:
  group: p1-u-02-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: modern/checkers-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-fund --no-audit
      - name: Static syntax checks
        run: npm run check
      - name: Common Match Runtime contract tests
        run: node --test test/match-runtime.test.js
