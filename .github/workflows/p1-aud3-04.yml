name: P1-AUD3-04 Gomoku Durability

on:
  pull_request:
    paths:
      - "modern/checkers-engine/src/postgres-gomoku-service.js"
      - "modern/checkers-engine/src/gomoku-http.js"
      - "modern/checkers-engine/test/p1-aud3-04-gomoku-postgres.test.js"
      - ".github/workflows/p1-aud3-04.yml"

permissions:
  contents: read

jobs:
  postgres-durability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gracz
          POSTGRES_PASSWORD: gracz_test
          POSTGRES_DB: gracz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gracz -d gracz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      P1_AUD3_04_DATABASE_URL: postgresql://gracz:gracz_test@localhost:5432/gracz_test
    defaults:
      run:
        working-directory: modern/checkers-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts --no-fund --no-audit
      - name: Syntax checks
        run: node --check src/postgres-gomoku-service.js && node --check src/gomoku-http.js
      - name: Gomoku durability concurrency recovery tests
        run: node --test test/p1-aud3-04-gomoku-postgres.test.js
