name: B1-C25 focused validation

on:
  push:
    branches:
      - fix/wave-b-b1-c25-lobby-room-single-acquisition

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gracz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gracz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: modern/checkers-engine
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gracz_test
      P1_C_01_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gracz_test
      P1_U_02_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gracz_test
      P1_U_02_REQUIRE_POSTGRES: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: modern/checkers-engine/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Static syntax validation
        run: npm run check

      - name: B1-C25 acquisition and room semantics
        run: node --test test/wave-b-b1-c25-lobby-room-single-acquisition.test.js

      - name: Lobby PostgreSQL and C19 regressions
        run: >-
          node --test
          test/advanced-scalability-wave-a-f02-lobby-postgres.test.js
          test/advanced-scalability-wave-a-c6-lobby-atomic-start.test.js
          test/auth-lobby.test.js
          test/wave-b-b1-c19-lobby-state-single-acquisition.test.js

      - name: C22 listener isolation regression
        run: node --test test/wave-b-b1-c22-global-chat-listen-isolation.test.js

      - name: SessionStore CAS and MatchRuntime regressions
        run: >-
          node --test
          test/p1-c-01-postgres-cas.test.js
          test/p1-u-02-match-runtime-postgres.test.js

      - name: C02 durability and accounting regression
        run: node --test test/wave-b-b1-c17-c02-checkers-durability-attribution.test.js
