name: B1-C35 Focused Newsletter Lifecycle Admin Pool Validation

on:
  push:
    branches: [fix/wave-b-b1-c35-newsletter-lifecycle-admin-pool-sharing]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gracz_b1_c35
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d gracz_b1_c35"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: modern/checkers-engine

    env:
      B1_C35_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_b1_c35
      B1_C34_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_b1_c35
      B1_C33_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_b1_c35
      B1_C32_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_b1_c35
      B1_C31_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_b1_c35
      P1_C_01_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_b1_c35
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_b1_c35
      POSTGRES_POOL_BUDGET: '64'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Exact C34 ancestry source identity and C35 scope
        run: |
          set -euo pipefail
          BASE=ba76991e0df4fd85e51894ce947c8db4feb43c27
          TREE=306c66ddc55232d037a5a86d530a5b49effb973b
          test "$(git rev-parse ${BASE}^{tree})" = "$TREE"
          git merge-base --is-ancestor "$BASE" HEAD
          unexpected="$(git diff --name-only "$BASE" HEAD | grep -Ev '^(modern/checkers-engine/src/newsletter-lifecycle-recorder\.js|modern/checkers-engine/src/main\.js|modern/checkers-engine/src/postgres-pool-budget\.cjs|modern/checkers-engine/test/wave-b-b1-c32-cluster-aware-postgres-budget-guard\.test\.js|modern/checkers-engine/test/wave-b-b1-c33-auth-session-identity-pool-sharing\.test\.js|modern/checkers-engine/test/wave-b-b1-c34-message-attachment-account-pool-sharing\.test\.js|modern/checkers-engine/test/wave-b-b1-c35-newsletter-lifecycle-admin-pool-sharing\.test\.js|\.github/workflows/b1-c35-focused-validation\.yml)$' || true)"
          test -z "$unexpected"
          git diff --exit-code "$BASE" HEAD -- modern/checkers-engine/perf

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Static syntax gate
        run: |
          set -euo pipefail
          node --check src/newsletter-lifecycle-recorder.js
          node --check src/main.js
          node --check src/postgres-pool-budget.cjs
          node --check test/wave-b-b1-c32-cluster-aware-postgres-budget-guard.test.js
          node --check test/wave-b-b1-c33-auth-session-identity-pool-sharing.test.js
          node --check test/wave-b-b1-c34-message-attachment-account-pool-sharing.test.js
          node --check test/wave-b-b1-c35-newsletter-lifecycle-admin-pool-sharing.test.js

      - name: C35 real PostgreSQL lifecycle admin-pool ownership and shutdown
        run: |
          node --require ./src/pg-secure-preload.cjs --test --test-concurrency=1 \
            test/wave-b-b1-c35-newsletter-lifecycle-admin-pool-sharing.test.js

      - name: Newsletter lifecycle admin and security regressions
        run: |
          node --test --test-concurrency=1 \
            test/newsletter-lifecycle-analytics.test.js \
            test/newsletter-admin.test.js \
            test/newsletter-security.test.js \
            test/newsletter-penetration.test.js

      - name: C32 canonical profile cluster guard preload regression
        run: |
          node --require ./src/pg-secure-preload.cjs --test --test-concurrency=1 \
            test/wave-b-b1-c32-cluster-aware-postgres-budget-guard.test.js

      - name: C31 C33 C34 ownership regressions
        run: |
          node --require ./src/pg-secure-preload.cjs --test --test-concurrency=1 \
            test/wave-b-b1-c31-secureaccounts-identity-pool-sharing.test.js
          node --require ./src/pg-secure-preload.cjs --test --test-concurrency=1 \
            test/wave-b-b1-c33-auth-session-identity-pool-sharing.test.js
          node --require ./src/pg-secure-preload.cjs --test --test-concurrency=1 \
            test/wave-b-b1-c34-message-attachment-account-pool-sharing.test.js

      - name: Frozen C19 C22 C25 C27 acquisition and listener regressions
        run: |
          node --require ./src/pg-secure-preload.cjs --test --test-concurrency=1 \
            test/wave-b-b1-c19-lobby-state-single-acquisition.test.js
          node --require ./src/pg-secure-preload.cjs --test --test-concurrency=1 \
            test/wave-b-b1-c22-global-chat-listen-isolation.test.js
          node --require ./src/pg-secure-preload.cjs --test --test-concurrency=1 \
            test/wave-b-b1-c25-lobby-room-single-acquisition.test.js
          node --require ./src/pg-secure-preload.cjs --test --test-concurrency=1 \
            test/wave-b-b1-c27-global-chat-presence-single-acquisition.test.js

      - name: Final no-load and ownership scope gate
        run: |
          set -euo pipefail
          BASE=ba76991e0df4fd85e51894ce947c8db4feb43c27
          git diff --exit-code "$BASE" HEAD -- modern/checkers-engine/perf
          git diff --exit-code "$BASE" HEAD -- \
            modern/checkers-engine/src/newsletter.js \
            modern/checkers-engine/src/newsletter-admin-service.js \
            modern/checkers-engine/src/postgres-accounts.js \
            modern/checkers-engine/src/secure-accounts.js \
            modern/checkers-engine/src/auth-sessions.js \
            modern/checkers-engine/src/message-attachments.js \
            modern/checkers-engine/src/postgres-session-store.js \
            modern/checkers-engine/src/distributed-infrastructure.js \
            modern/checkers-engine/src/rankings.js \
            modern/checkers-engine/src/tournaments.js
