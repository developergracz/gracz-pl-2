name: B1-C42 Canonical 100 VU Post-C41 Revalidation

on:
  push:
    branches:
      - perf/wave-b-b1-c42-100vu-post-c41-revalidation
    paths:
      - '.github/workflows/b1-c42-100vu-post-c41-revalidation.yml'

permissions:
  contents: read

jobs:
  b1-c42-100vu:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gracz_wave_b
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gracz_wave_b"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: modern/checkers-engine

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_wave_b
      WAVE_B_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_wave_b
      B1_C32_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_wave_b
      P1_C_01_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_wave_b
      POSTGRES_POOL_BUDGET: '64'
      WAVE_B_SEED: '20260909'

    steps:
      - name: Checkout exact C42 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Initialize C42 evidence
        run: |
          set -euo pipefail
          mkdir -p perf/k6/reports
          echo "C42_APP_PACKAGE_JSON=$GITHUB_WORKSPACE/modern/checkers-engine/package.json" >> "$GITHUB_ENV"
          : > perf/k6/reports/b1-c42-phase-status.txt
          echo 0 > perf/k6/reports/b1-c42-load-executions.txt
          cat > perf/k6/reports/b1-c42-load-contract.txt <<'EOF'
          WAVE_B_RUN_ID=b1-c42-post-c41-v100
          WAVE_B_REPLICAS=1
          WAVE_B_VUS=100
          WAVE_B_GAME_COUNT=50
          WAVE_B_WARMUP_SECONDS=120
          WAVE_B_STEADY_SECONDS=300
          WAVE_B_COOLDOWN_SECONDS=120
          WAVE_B_THINK_SECONDS=0.05
          WAVE_B_SEED=20260909
          WAVE_B_SCENARIO=mixed-platform
          runner=perf/scripts/wave-b-runner.sh
          authorized_invocations=1
          EOF

      - name: Generate isolated masked benchmark secrets
        run: |
          set -euo pipefail
          for name in AUTH_SECRET MESSAGE_ENCRYPTION_KEY ATTACHMENT_ENCRYPTION_KEY MFA_ENCRYPTION_KEY; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Install application dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Verify exact authorized source and C42-only scope
        run: |
          set -euo pipefail
          SOURCE=fa0b6824fa623f2f44cc3d452ee16b1f9347a54c
          SOURCE_TREE=2d362f66abe503b02bf60eacf8ef2645fd2271b6
          test "$(git rev-parse ${SOURCE}^{tree})" = "$SOURCE_TREE"
          git merge-base --is-ancestor "$SOURCE" HEAD
          test "$(git merge-base "$SOURCE" HEAD)" = "$SOURCE"
          unexpected="$(git diff --name-only "$SOURCE" HEAD | grep -Ev '^\.github/workflows/b1-c42-100vu-post-c41-revalidation\.yml$' || true)"
          test -z "$unexpected"
          git diff --exit-code "$SOURCE" HEAD -- modern/checkers-engine/src modern/checkers-engine/test modern/checkers-engine/perf
          {
            echo "repository=developergracz/gracz-pl-2"
            echo "authorized_source_branch=fix/wave-b-b1-c41-lobby-read-state-room-snapshot-reuse"
            echo "authorized_source_head=$SOURCE"
            echo "authorized_source_tree=$SOURCE_TREE"
            echo "c42_branch=perf/wave-b-b1-c42-100vu-post-c41-revalidation"
            echo "workflow_head=$(git rev-parse HEAD)"
            echo "workflow_tree=$(git rev-parse HEAD^{tree})"
            echo "application_source_head=$SOURCE"
            echo "application_source_tree=$SOURCE_TREE"
            echo "ahead=$(git rev-list --count ${SOURCE}..HEAD)"
            echo "behind=$(git rev-list --count HEAD..${SOURCE})"
            echo "changed_files:"
            git diff --name-only "$SOURCE" HEAD
          } | tee perf/k6/reports/b1-c42-identity.txt
          test "$(git rev-list --count HEAD..${SOURCE})" = "0"
          test "$(git diff --name-only "$SOURCE" HEAD | wc -l)" = "1"
          test "$(git diff --name-only "$SOURCE" HEAD)" = ".github/workflows/b1-c42-100vu-post-c41-revalidation.yml"
          sha256sum perf/scripts/wave-b-runner.sh | tee perf/k6/reports/b1-c42-runner-sha256.txt
          echo identity=PASS >> perf/k6/reports/b1-c42-phase-status.txt

      - name: Verify tools and PostgreSQL fixture
        run: |
          set -euo pipefail
          command -v k6
          command -v psql
          command -v ss
          k6 version
          test "$(psql "$DATABASE_URL" -Atc 'SHOW max_connections;')" = "100"
          test "$(psql "$DATABASE_URL" -Atc 'SHOW superuser_reserved_connections;')" = "3"
          psql "$DATABASE_URL" -Atc "SELECT version(); SHOW max_connections; SHOW reserved_connections; SHOW superuser_reserved_connections;" | tee perf/k6/reports/b1-c42-postgres-fixture.txt
          echo fixture=PASS >> perf/k6/reports/b1-c42-phase-status.txt

      - name: Required C19 C22 C25 C27 C32 C38 C41 structural gates
        run: |
          set -euo pipefail
          run_gate() {
            name="$1"; shift
            set +e
            "$@" > "perf/k6/reports/b1-c42-${name}.log" 2>&1
            rc=$?
            set -e
            cat "perf/k6/reports/b1-c42-${name}.log"
            if [ "$rc" -ne 0 ]; then
              echo "${name}=FAIL:${rc}" >> perf/k6/reports/b1-c42-phase-status.txt
              exit "$rc"
            fi
            echo "${name}=PASS" >> perf/k6/reports/b1-c42-phase-status.txt
          }
          run_gate c38 node --require ./src/pg-secure-preload.cjs --test --test-concurrency=1 test/wave-b-b1-c38-community-pool-isolation.test.js
          run_gate c41 node --require ./src/pg-secure-preload.cjs --test --test-concurrency=1 test/wave-b-b1-c41-lobby-read-state-room-snapshot-reuse.test.js
          run_gate c19 node --require ./src/pg-secure-preload.cjs --test --test-concurrency=1 test/wave-b-b1-c19-lobby-state-single-acquisition.test.js
          run_gate c22 node --require ./src/pg-secure-preload.cjs --test --test-concurrency=1 test/wave-b-b1-c22-global-chat-listen-isolation.test.js
          run_gate c25 node --require ./src/pg-secure-preload.cjs --test --test-concurrency=1 test/wave-b-b1-c25-lobby-room-single-acquisition.test.js
          run_gate c27 node --require ./src/pg-secure-preload.cjs --test --test-concurrency=1 test/wave-b-b1-c27-global-chat-presence-single-acquisition.test.js
          run_gate c32 node --require ./src/pg-secure-preload.cjs --test --test-concurrency=1 test/wave-b-b1-c32-cluster-aware-postgres-budget-guard.test.js

      - name: Verify canonical post-C41 connection profile
        run: |
          set -euo pipefail
          node <<'NODE' | tee perf/k6/reports/b1-c42-resource-profile.json
          const b = require('./src/postgres-pool-budget.cjs');
          const profile = b.POSTGRES_RESOURCE_PROFILE;
          const session = profile.pools.filter((entry) => entry.owner === 'PostgresSessionStore');
          const community = profile.pools.filter((entry) => entry.owner === 'PostgresCommunityPool');
          if (profile.pools.length !== 15) process.exit(41);
          if (session.length !== 1 || session[0].max !== 4) process.exit(42);
          if (community.length !== 1 || community[0].max !== 4) process.exit(43);
          if (b.aggregatePoolMax() !== 52) process.exit(44);
          if (b.aggregateExternalPersistentClients() !== 1) process.exit(45);
          if (b.aggregateStartupTemporaryClients() !== 1) process.exit(46);
          const fixture = {
            maxConnections: 100,
            reservedConnections: 0,
            superuserReservedConnections: 3,
            operationalHeadroom: 10,
            environment: { POSTGRES_POOL_BUDGET: '64' },
          };
          const one = b.connectionBudgetPlan({ ...fixture, replicaCount: 1 });
          const two = b.connectionBudgetPlan({ ...fixture, replicaCount: 2 });
          if (one.safeApplicationCapacity !== 87 || one.steadyEnvelope !== 53 || one.startupEnvelope !== 54 || !one.safe) process.exit(47);
          if (two.steadyEnvelope !== 106 || two.startupEnvelope !== 108 || two.safe) process.exit(48);
          console.log(JSON.stringify({
            physicalPoolOwners: profile.pools.length,
            aggregatePoolMax: b.aggregatePoolMax(),
            sessionStore: session[0],
            community: community[0],
            externalPersistent: b.aggregateExternalPersistentClients(),
            startupTemporary: b.aggregateStartupTemporaryClients(),
            oneReplica: { steady: one.steadyEnvelope, startup: one.startupEnvelope, safeCapacity: one.safeApplicationCapacity, safe: one.safe },
            twoReplicas: { steady: two.steadyEnvelope, startup: two.startupEnvelope, safeCapacity: two.safeApplicationCapacity, safe: two.safe },
          }, null, 2));
          NODE
          echo profile=PASS >> perf/k6/reports/b1-c42-phase-status.txt

      - name: Generate runtime-only dual-pool instrumentation
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/b1-c42-dual-pool-preload.cjs" <<'C42JS'
          "use strict";
          const fs = require("node:fs");
          const path = require("node:path");
          const { createHistogram } = require("node:perf_hooks");
          const { createRequire } = require("node:module");
          const appPackageJson = process.env.C42_APP_PACKAGE_JSON;
          if (!appPackageJson) throw new Error("C42_APP_PACKAGE_JSON is required");
          const appRequire = createRequire(appPackageJson);
          const pgResolvedPath = appRequire.resolve("pg");
          const pg = appRequire("pg");
          const OriginalPool = pg.Pool;
          const lifecycle = { requestedPools: 0 };
          const originalClientQuery = pg.Client.prototype.query;
          const output = process.env.C42_DUAL_POOL_FILE;
          if (!output) return;

          function ownerFromStack(stack) {
            const s = String(stack || "");
            if (/\/src\/postgres-session-store\.js(?::|\))/u.test(s)) return "SESSION_STORE_POOL";
            if (/\/src\/postgres-community-pool\.js(?::|\))/u.test(s)) return "COMMUNITY_POOL";
            return null;
          }
          function timing() {
            return { histogram: createHistogram({ lowest: 1, highest: 60_000_000, figures: 3 }), errors: 0 };
          }
          function record(t, ms, error = null) {
            t.histogram.record(Math.max(1, Math.min(60_000_000, Math.round(ms * 1000))));
            if (error) t.errors += 1;
          }
          function snap(t) {
            const h = t.histogram, count = Number(h.count || 0);
            return {
              count,
              p50Ms: count ? Number(h.percentile(50)) / 1000 : 0,
              p95Ms: count ? Number(h.percentile(95)) / 1000 : 0,
              p99Ms: count ? Number(h.percentile(99)) / 1000 : 0,
              maxMs: count ? Number(h.max) / 1000 : 0,
              errors: t.errors,
            };
          }
          const stats = new Map();
          class C42Pool extends OriginalPool {
            constructor(options) {
              lifecycle.requestedPools += 1;
              super(options);
              const owner = ownerFromStack(new Error().stack);
              if (owner) {
                if (stats.has(owner)) throw new Error("C42 duplicate canonical pool owner: " + owner);
                const row = {
                  owner,
                  pool: this,
                  configuredMax: Number(this.options?.max || 0),
                  maxWaiting: Number(this.waitingCount || 0),
                  acquire: timing(),
                  query: timing(),
                  hold: timing(),
                };
                stats.set(owner, row);
                Object.defineProperty(this, "__c42Stats", { value: row, configurable: false, enumerable: false });
              }
            }
          }
          Object.defineProperty(pg, "Pool", { value: C42Pool, configurable: true, enumerable: true, writable: true });
          const originalPoolConnect = OriginalPool.prototype.connect;
          C42Pool.prototype.connect = function c42Connect(callback) {
            const stat = this.__c42Stats;
            if (!stat) return originalPoolConnect.call(this, callback);
            stat.maxWaiting = Math.max(stat.maxWaiting, Number(this.waitingCount || 0));
            const started = process.hrtime.bigint();
            const acquired = (client, error = null) => {
              record(stat.acquire, Number(process.hrtime.bigint() - started) / 1e6, error);
              stat.maxWaiting = Math.max(stat.maxWaiting, Number(this.waitingCount || 0));
              if (client) {
                try { Object.defineProperty(client, "__c42Stats", { value: stat, configurable: true, enumerable: false, writable: true }); } catch {}
              }
            };
            if (typeof callback === "function") {
              return originalPoolConnect.call(this, (error, client, release) => {
                acquired(client, error);
                if (error || typeof release !== "function") return callback(error, client, release);
                const holdStarted = process.hrtime.bigint();
                let released = false;
                const wrappedRelease = (...args) => {
                  if (!released) {
                    released = true;
                    record(stat.hold, Number(process.hrtime.bigint() - holdStarted) / 1e6);
                  }
                  return release(...args);
                };
                return callback(error, client, wrappedRelease);
              });
            }
            return Promise.resolve(originalPoolConnect.call(this)).then((client) => {
              acquired(client);
              const release = client.release;
              if (typeof release === "function") {
                const holdStarted = process.hrtime.bigint();
                let released = false;
                client.release = function c42Release(...args) {
                  if (!released) {
                    released = true;
                    record(stat.hold, Number(process.hrtime.bigint() - holdStarted) / 1e6);
                  }
                  client.release = release;
                  return release.apply(this, args);
                };
              }
              return client;
            }, (error) => {
              acquired(null, error);
              throw error;
            });
          };
          function instrumentQueryCall(stat, receiver, original, args) {
            const started = process.hrtime.bigint();
            let done = false;
            const finish = (error = null) => {
              if (done) return;
              done = true;
              record(stat.query, Number(process.hrtime.bigint() - started) / 1e6, error);
            };
            const callArgs = [...args];
            const last = callArgs.length - 1;
            if (last >= 0 && typeof callArgs[last] === "function") {
              const callback = callArgs[last];
              callArgs[last] = function c42Callback(error, result) {
                finish(error);
                return callback.call(this, error, result);
              };
              try { return original.apply(receiver, callArgs); } catch (error) { finish(error); throw error; }
            }
            let result;
            try { result = original.apply(receiver, callArgs); } catch (error) { finish(error); throw error; }
            if (!result || typeof result.then !== "function") { finish(); return result; }
            return result.then((value) => { finish(); return value; }, (error) => { finish(error); throw error; });
          }

          pg.Client.prototype.query = function c42Query(...args) {
            const stat = this.__c42Stats;
            if (!stat) return originalClientQuery.apply(this, args);
            return instrumentQueryCall(stat, this, originalClientQuery, args);
          };

          if (process.env.C42_SELF_TEST === "1") {
            Object.defineProperty(globalThis, "__B1_C42", {
              value: { ownerFromStack, instrumentQueryCall, timing, snap, stats, lifecycle, pgResolvedPath, pg },
              configurable: true,
              enumerable: false,
            });
          }

          fs.mkdirSync(path.dirname(output), { recursive: true });
          const timer = setInterval(() => {
            for (const stat of stats.values()) stat.maxWaiting = Math.max(stat.maxWaiting, Number(stat.pool.waitingCount || 0));
            const row = {
              ts: new Date().toISOString(),
              owners: [...stats.values()].sort((a, b) => a.owner.localeCompare(b.owner)).map((stat) => ({
                owner: stat.owner,
                configuredMax: stat.configuredMax,
                totalCount: Number(stat.pool.totalCount || 0),
                idleCount: Number(stat.pool.idleCount || 0),
                waitingCount: Number(stat.pool.waitingCount || 0),
                peakWaiting: stat.maxWaiting,
                acquire: snap(stat.acquire),
                query: snap(stat.query),
                hold: snap(stat.hold),
              })),
            };
            fs.appendFileSync(output, JSON.stringify(row) + "\n");
          }, 1000);
          timer.unref();
          C42JS
          node --check "$RUNNER_TEMP/b1-c42-dual-pool-preload.cjs"
          sha256sum "$RUNNER_TEMP/b1-c42-dual-pool-preload.cjs" | tee perf/k6/reports/b1-c42-runtime-instrumentation-sha256.txt
          echo instrumentation=PASS >> perf/k6/reports/b1-c42-phase-status.txt

      - name: Verify application-scoped pg resolution
        run: |
          set -euo pipefail
          test -f "$C42_APP_PACKAGE_JSON"
          node <<'NODE' | tee perf/k6/reports/b1-c42-module-resolution.json
          const fs = require("node:fs");
          const path = require("node:path");
          const { createRequire } = require("node:module");
          const pkg = process.env.C42_APP_PACKAGE_JSON;
          const workspace = process.env.GITHUB_WORKSPACE;
          if (!fs.existsSync(pkg)) process.exit(51);
          const resolved = createRequire(pkg).resolve("pg");
          const expectedRoot = path.join(workspace, "modern", "checkers-engine", "node_modules", "pg");
          if (!(resolved === expectedRoot || resolved.startsWith(expectedRoot + path.sep))) process.exit(52);
          console.log(JSON.stringify({
            applicationPackagePath: pkg,
            resolvedPgPath: resolved,
            nodeVersion: process.version
          }, null, 2));
          NODE
          echo module_resolution=PASS >> perf/k6/reports/b1-c42-phase-status.txt

      - name: Mandatory preload smoke test
        run: |
          set -euo pipefail
          C42_DUAL_POOL_FILE="$RUNNER_TEMP/b1-c42-smoke.jsonl" \
          C42_SELF_TEST=1 \
          NODE_OPTIONS="--require=$RUNNER_TEMP/b1-c42-dual-pool-preload.cjs" \
          node - <<'NODE' | tee perf/k6/reports/b1-c42-preload-smoke.json
          const hook = globalThis.__B1_C42;
          if (!hook) process.exit(61);
          if (typeof hook.pg?.Pool !== "function") process.exit(62);
          if (!String(hook.pgResolvedPath).includes("/modern/checkers-engine/node_modules/pg/")) process.exit(63);
          if (hook.lifecycle.requestedPools !== 0) process.exit(64);
          if (hook.stats.size !== 0) process.exit(65);
          console.log(JSON.stringify({
            status: "PRELOAD_SMOKE = PASS",
            preloadLoaded: true,
            pgResolved: true,
            pgPoolAvailable: true,
            instrumentationCreatedPools: 0,
            instrumentationCreatedPostgresConnections: 0,
            applicationSqlExecutedByPreload: 0
          }, null, 2));
          NODE
          git diff --exit-code -- src test perf package.json package-lock.json
          echo preload_smoke=PASS >> perf/k6/reports/b1-c42-phase-status.txt

      - name: Instrumentation classification and semantics self-test
        run: |
          set -euo pipefail
          C42_DUAL_POOL_FILE="$RUNNER_TEMP/b1-c42-selftest.jsonl" \
          C42_SELF_TEST=1 \
          NODE_OPTIONS="--require=$RUNNER_TEMP/b1-c42-dual-pool-preload.cjs" \
          node --input-type=module - <<'NODE' | tee perf/k6/reports/b1-c42-instrumentation-self-test.json
          import path from "node:path";
          const hook = globalThis.__B1_C42;
          if (!hook) process.exit(71);
          const pg = hook.pg;
          const root = path.join(process.env.GITHUB_WORKSPACE, "modern", "checkers-engine");

          function poolFromSource(file, max) {
            const source = path.join(root, "src", file);
            const factory = new Function("pg", "max", `
              return function constructPhysicalPool() {
                return new pg.Pool({
                  connectionString: "postgres://invalid.invalid/gracz",
                  max,
                  connectionTimeoutMillis: 1
                });
              };
              //# sourceURL=${source}
            `)(pg, max);
            return factory();
          }

          const session = poolFromSource("postgres-session-store.js", 4);
          const community = poolFromSource("postgres-community-pool.js", 4);
          const unrelated = new pg.Pool({
            connectionString: "postgres://invalid.invalid/gracz",
            max: 7,
            connectionTimeoutMillis: 1
          });

          if (session.__c42Stats?.owner !== "SESSION_STORE_POOL") process.exit(72);
          if (community.__c42Stats?.owner !== "COMMUNITY_POOL") process.exit(73);
          if (unrelated.__c42Stats) process.exit(74);
          if (session.options.max !== 4 || community.options.max !== 4 || unrelated.options.max !== 7) process.exit(75);
          if (hook.stats.size !== 2) process.exit(76);
          if (hook.lifecycle.requestedPools !== 3) process.exit(77);
          if ([session, community, unrelated].some((p) => p.totalCount !== 0 || p.idleCount !== 0 || p.waitingCount !== 0)) process.exit(78);

          const stat = { query: hook.timing() };
          const sql = "SELECT c42_r1_selftest_marker = $1";
          const params = ["parameter-marker-not-for-evidence"];
          const sentinel = { rows: [{ ok: true }] };
          const receiver = {};

          const syncValue = hook.instrumentQueryCall(stat, receiver, function(...args) {
            if (args[0] !== sql || args[1] !== params) throw new Error("query arguments changed");
            return sentinel;
          }, [sql, params]);
          if (syncValue !== sentinel) process.exit(79);

          const asyncValue = await hook.instrumentQueryCall(stat, receiver, function(...args) {
            if (args[0] !== sql || args[1] !== params) throw new Error("async query arguments changed");
            return Promise.resolve(sentinel);
          }, [sql, params]);
          if (asyncValue !== sentinel) process.exit(80);

          const sameError = new Error("c42-sentinel-error");
          let syncError;
          try {
            hook.instrumentQueryCall(stat, receiver, function() { throw sameError; }, [sql, params]);
          } catch (error) { syncError = error; }
          if (syncError !== sameError) process.exit(81);

          let asyncError;
          try {
            await hook.instrumentQueryCall(stat, receiver, function() { return Promise.reject(sameError); }, [sql, params]);
          } catch (error) { asyncError = error; }
          if (asyncError !== sameError) process.exit(82);

          const evidence = {
            sessionPhysicalPool: session.__c42Stats.owner,
            communityPhysicalPool: community.__c42Stats.owner,
            unrelatedSyntheticPool: "excluded",
            configuredMax: {
              session: session.options.max,
              community: community.options.max,
              unrelated: unrelated.options.max
            },
            intendedPoolsConstructed: 3,
            actualPoolConstructorCalls: hook.lifecycle.requestedPools,
            additionalPoolsCreatedByInstrumentation: 0,
            postgresConnectionsCreated: session.totalCount + community.totalCount + unrelated.totalCount,
            sqlTextUnchanged: true,
            returnValuesUnchanged: true,
            errorsUnchanged: true,
            sqlParameterValuesStoredInEvidence: false,
            queryTiming: hook.snap(stat.query)
          };
          const serialized = JSON.stringify(evidence);
          if (serialized.includes("c42_r1_selftest_marker") || serialized.includes("parameter-marker-not-for-evidence")) process.exit(83);
          console.log(JSON.stringify(evidence, null, 2));
          await Promise.all([session.end(), community.end(), unrelated.end()]);
          NODE
          git diff --exit-code -- src test perf package.json package-lock.json
          echo instrumentation_self_test=PASS >> perf/k6/reports/b1-c42-phase-status.txt

      - name: Reset isolated benchmark database
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;' | tee perf/k6/reports/b1-c42-reset.log
          echo reset=PASS >> perf/k6/reports/b1-c42-phase-status.txt

      - name: Execute exactly one canonical B1 100 VU run
        run: |
          set -euo pipefail
          echo 1 > perf/k6/reports/b1-c42-load-executions.txt
          set +e
          C42_APP_PACKAGE_JSON="$C42_APP_PACKAGE_JSON" \
          C42_DUAL_POOL_FILE=perf/k6/reports/b1-c42-post-c41-v100-dual-pools.jsonl \
          NODE_OPTIONS="--require=$RUNNER_TEMP/b1-c42-dual-pool-preload.cjs" \
          WAVE_B_RUN_ID=b1-c42-post-c41-v100 \
          WAVE_B_REPLICAS=1 \
          WAVE_B_VUS=100 \
          WAVE_B_GAME_COUNT=50 \
          WAVE_B_WARMUP_SECONDS=120 \
          WAVE_B_STEADY_SECONDS=300 \
          WAVE_B_COOLDOWN_SECONDS=120 \
          WAVE_B_THINK_SECONDS=0.05 \
          WAVE_B_SEED=20260909 \
          WAVE_B_SCENARIO=mixed-platform \
          bash perf/scripts/wave-b-runner.sh
          rc=$?
          set -e
          echo "$rc" > perf/k6/reports/b1-c42-load-rc.txt
          echo "load_rc=$rc" >> perf/k6/reports/b1-c42-phase-status.txt
          exit 0

      - name: Build C42 exact evidence analysis
        if: always()
        run: |
          set +e
          node perf/scripts/wave-b-summarize.mjs
          node <<'NODE'
          const fs = require("node:fs");
          const dir = "perf/k6/reports";
          const run = "b1-c42-post-c41-v100";
          const read = (p) => fs.existsSync(p) ? fs.readFileSync(p, "utf8") : "";
          const json = (p) => { try { return JSON.parse(read(p)); } catch { return null; } };
          const k = json(`${dir}/${run}-summary.json`) || json(`${dir}/${run}-k6-summary-export.json`);
          const rec = json(`${dir}/${run}-record.json`);
          const corr = json(`${dir}/${run}-correctness.json`);
          const metrics = k?.metrics || {};
          const vals = (name) => {
            const metric = metrics?.[name] || {};
            return metric?.values || metric;
          };
          const trend = (name) => {
            const v = vals(name);
            return { p50: v.med ?? null, p90: v["p(90)"] ?? null, p95: v["p(95)"] ?? null, p99: v["p(99)"] ?? null, max: v.max ?? null };
          };
          const counter = (name) => Number(vals(name).count ?? 0);
          const rate = (name) => Number(vals(name).rate ?? vals(name).value ?? 0);
          const trueCount = (name) => Number(vals(name).passes ?? 0);
          const loadRc = Number(read(`${dir}/b1-c42-load-rc.txt`).trim() || -1);
          const executions = Number(read(`${dir}/b1-c42-load-executions.txt`).trim() || 0);

          const appCsv = read(`${dir}/${run}-application.csv`).trim().split(/\n+/).slice(1);
          let cpuMax=0,cpuSum=0,cpuN=0,rssMaxKb=0;
          for (const line of appCsv) {
            const p=line.split(",");
            if (p[5] === "PROCESS_DEAD") continue;
            const cpu=Number(p[2])||0,rss=Number(p[3])||0;
            cpuMax=Math.max(cpuMax,cpu); cpuSum+=cpu; cpuN+=1; rssMaxKb=Math.max(rssMaxKb,rss);
          }

          const obsLines = read(`${dir}/${run}-observability-0.jsonl`).trim().split(/\n+/).filter(Boolean);
          let heapUsedMax=0,heapTotalMax=0,eventLoopP99Max=0,activeRequestsMax=0,genericPoolWaitMax=0;
          for (const line of obsLines) {
            try {
              const x=JSON.parse(line);
              heapUsedMax=Math.max(heapUsedMax,Number(x.heapUsed)||0);
              heapTotalMax=Math.max(heapTotalMax,Number(x.heapTotal)||0);
              eventLoopP99Max=Math.max(eventLoopP99Max,Number(x.eventLoopP99Ms)||0);
              activeRequestsMax=Math.max(activeRequestsMax,Number(x.activeRequests)||0);
              genericPoolWaitMax=Math.max(genericPoolWaitMax,Number(x.poolWaitMaxMs)||0);
            } catch {}
          }

          const dualLines = read(`${dir}/${run}-dual-pools.jsonl`).trim().split(/\n+/).filter(Boolean);
          const dualLast = dualLines.length ? jsonFrom(dualLines.at(-1)) : null;
          function jsonFrom(s){ try{return JSON.parse(s)}catch{return null} }
          const ownerMap = Object.fromEntries((dualLast?.owners || []).map(x => [x.owner, x]));
          const sessionPool = ownerMap.SESSION_STORE_POOL || null;
          const communityPool = ownerMap.COMMUNITY_POOL || null;

          const pgCsv = read(`${dir}/${run}-postgres.csv`).trim().split(/\n+/);
          const pgHeader = pgCsv.length ? pgCsv[0].split(",") : [];
          const pgRows = pgCsv.slice(1).map(line => line.split(",")).filter(p => p.length >= pgHeader.length);
          const idx = (name) => pgHeader.indexOf(name);
          const maxCol = (name) => {
            const i=idx(name); if(i<0) return null;
            let m=0; for(const p of pgRows) m=Math.max(m,Number(p[i])||0); return m;
          };
          const lastCol = (name) => {
            const i=idx(name); if(i<0 || !pgRows.length) return null;
            return Number(pgRows.at(-1)[i])||0;
          };
          const pg = {
            maximumBackends:maxCol("numbackends"),
            maximumActive:maxCol("active"),
            maximumIdle:maxCol("idle"),
            idleInTransaction:maxCol("idle_in_transaction"),
            waiting:maxCol("waiting"),
            clientWait:maxCol("client_wait"),
            lockWait:maxCol("lock_wait"),
            lwlockWait:maxCol("lwlock_wait"),
            ioWait:maxCol("io_wait"),
            longQueries:maxCol("long_queries"),
            maximumQueryAgeMs:maxCol("max_query_ms"),
            maximumTransactionAgeMs:maxCol("max_xact_ms"),
            waitingLocks:maxCol("waiting_locks"),
            deadlocks:maxCol("deadlocks"),
            tempFiles:lastCol("temp_files"),
            tempBytes:lastCol("temp_bytes"),
          };

          const performance = {
            FAST: trend("wave_b_fast_read_ms"),
            NORMAL: trend("wave_b_normal_command_ms"),
            COMPLEX: trend("wave_b_complex_read_ms"),
          };
          const throughput = {
            totalOperations: counter("wave_b_operations"),
            operationsPerSec: rate("wave_b_operations"),
            totalHttpRequests: counter("http_reqs"),
            httpRequestsPerSec: rate("http_reqs"),
            readOperationsPerSec: rate("wave_b_read_operations"),
            writeAttempts: counter("wave_b_write_attempts"),
            writeAccepted: counter("wave_b_write_accepted"),
            checkersAccepted: counter("wave_b_checkers_write_accepted"),
            gomokuAccepted: counter("wave_b_gomoku_write_accepted"),
            thousandAccepted: counter("wave_b_thousand_write_accepted"),
          };
          const applicationCorrectnessFailures = Array.isArray(corr?.checks)
            ? corr.checks.filter((check) => check?.pass !== true).length
            : (corr?.pass === true ? 0 : null);
          const correctness = {
            correctnessExit: rec?.correctnessExit ?? null,
            correctness: rec?.correctnessExit === 0 ? "PASS" : "FAIL",
            unexpectedResponses: trueCount("wave_b_unexpected_error"),
            unexpectedErrorRate: rate("wave_b_unexpected_error"),
            http5xx: trueCount("wave_b_server_5xx"),
            server5xxRate: rate("wave_b_server_5xx"),
            timeouts: trueCount("wave_b_timeout"),
            timeoutRate: rate("wave_b_timeout"),
            applicationCorrectnessFailures,
            correctnessArtifactPass: corr?.pass ?? null,
            expected409: counter("wave_b_expected_409"),
            expected429: counter("wave_b_expected_429"),
          };
          const thresholds = {
            FAST: {p95:200,p99:500},
            NORMAL:{p95:300,p99:750},
            COMPLEX:{p95:500,p99:1000},
          };
          const thresholdVerdicts = Object.fromEntries(Object.entries(thresholds).map(([name,t]) => [name,{
            p95: Number(performance[name].p95) < t.p95 ? "PASS":"FAIL",
            p99: Number(performance[name].p99) < t.p99 ? "PASS":"FAIL",
          }]));
          const errorGate = correctness.correctness === "PASS" &&
            correctness.unexpectedErrorRate < 0.01 &&
            correctness.server5xxRate < 0.001 &&
            correctness.timeoutRate < 0.01;
          const perfPass = errorGate && Object.values(thresholdVerdicts).every(v => v.p95==="PASS" && v.p99==="PASS");
          const delta = (now, old) => (now == null || !Number.isFinite(Number(now))) ? null : ((Number(now)-old)/old)*100;
          const baseline = {
            source: "B1-C39-R1 run 34630885579 artifact 10277075112 raw evidence",
            FAST: {p95:605.58896575,p99:708.97719956},
            NORMAL:{p95:774.3841496,p99:855.06532264},
            COMPLEX:{p95:551.0467236,p99:759.76358424},
            totalOperations:80512,
            operationsPerSec:149.08709119297475,
            totalHttpRequests:142623,
            httpRequestsPerSec:264.1003602843755,
            community:{
              peakWaiting:50,
              acquisitions:44022,
              acquire:{p95Ms:222.847,p99Ms:303.871,maxMs:473.343},
              query:{count:56718,p95Ms:87.743,p99Ms:112.319,maxMs:193.535},
            },
            sessionStore:{
              peakWaiting:20,
              acquisitions:20952,
              acquire:{p95Ms:52.575,p99Ms:104.255,maxMs:208.511},
              query:{count:23605,p95Ms:64.031,p99Ms:93.759,maxMs:161.919},
            },
            application:{cpuMaxPct:89.8,rssMaxMb:416.32421875,eventLoopP99MaxMs:115.343359},
            postgres:{maximumBackends:30,maximumActive:8,waiting:29,clientWait:29,waitingLocks:2,deadlocks:0},
          };
          const comparison = {
            FAST_p95_pct:delta(performance.FAST.p95,baseline.FAST.p95),
            FAST_p99_pct:delta(performance.FAST.p99,baseline.FAST.p99),
            NORMAL_p95_pct:delta(performance.NORMAL.p95,baseline.NORMAL.p95),
            NORMAL_p99_pct:delta(performance.NORMAL.p99,baseline.NORMAL.p99),
            COMPLEX_p95_pct:delta(performance.COMPLEX.p95,baseline.COMPLEX.p95),
            COMPLEX_p99_pct:delta(performance.COMPLEX.p99,baseline.COMPLEX.p99),
            operationsPerSec_pct:delta(throughput.operationsPerSec,baseline.operationsPerSec),
            httpRequestsPerSec_pct:delta(throughput.httpRequestsPerSec,baseline.httpRequestsPerSec),
            communityPeakWaiting_pct:delta(communityPool?.peakWaiting,baseline.community.peakWaiting),
            communityAcquisitions_pct:delta(communityPool?.acquire?.count,baseline.community.acquisitions),
            communityAcquireP95_pct:delta(communityPool?.acquire?.p95Ms,baseline.community.acquire.p95Ms),
            communityAcquireP99_pct:delta(communityPool?.acquire?.p99Ms,baseline.community.acquire.p99Ms),
            communityAcquireMax_pct:delta(communityPool?.acquire?.maxMs,baseline.community.acquire.maxMs),
            communityQueryCount_pct:delta(communityPool?.query?.count,baseline.community.query.count),
            communityQueryP95_pct:delta(communityPool?.query?.p95Ms,baseline.community.query.p95Ms),
            communityQueryP99_pct:delta(communityPool?.query?.p99Ms,baseline.community.query.p99Ms),
            communityQueryMax_pct:delta(communityPool?.query?.maxMs,baseline.community.query.maxMs),
            sessionAcquireP95_pct:delta(sessionPool?.acquire?.p95Ms,baseline.sessionStore.acquire.p95Ms),
            sessionAcquireP99_pct:delta(sessionPool?.acquire?.p99Ms,baseline.sessionStore.acquire.p99Ms),
            sessionAcquireMax_pct:delta(sessionPool?.acquire?.maxMs,baseline.sessionStore.acquire.maxMs),
            sessionPeakWaiting_pct:delta(sessionPool?.peakWaiting,baseline.sessionStore.peakWaiting),
            cpuMax_pct:delta(cpuMax,baseline.application.cpuMaxPct),
            rssMax_pct:delta(rssMaxKb/1024,baseline.application.rssMaxMb),
            eventLoopP99Max_pct:delta(eventLoopP99Max,baseline.application.eventLoopP99MaxMs),
          };
          const phaseStatus = read(`${dir}/b1-c42-phase-status.txt`);
          const preRunGatesPass = [
            "identity=PASS","fixture=PASS","c38=PASS","c41=PASS","c19=PASS","c22=PASS","c25=PASS","c27=PASS","c32=PASS",
            "profile=PASS","instrumentation=PASS","module_resolution=PASS","preload_smoke=PASS","instrumentation_self_test=PASS"
          ].every((x) => phaseStatus.includes(x));
          const requiredLatency = [
            performance.FAST.p50, performance.FAST.p90, performance.FAST.p95, performance.FAST.p99,
            performance.NORMAL.p50, performance.NORMAL.p90, performance.NORMAL.p95, performance.NORMAL.p99,
            performance.COMPLEX.p50, performance.COMPLEX.p90, performance.COMPLEX.p95, performance.COMPLEX.p99,
          ];
          const testDurationSeconds = Number(k?.state?.testRunDurationMs ?? 0) / 1000;
          const rawMetricsValid = requiredLatency.every((v) => Number.isFinite(Number(v))) &&
            throughput.totalOperations > 0 && throughput.operationsPerSec > 0 &&
            throughput.totalHttpRequests > 0 && throughput.httpRequestsPerSec > 0 &&
            testDurationSeconds > 0 &&
            Number.isInteger(correctness.applicationCorrectnessFailures);
          const evidenceValid = preRunGatesPass && executions===1 && (loadRc===0 || loadRc===99) && !!k && !!rec && !!corr &&
            rawMetricsValid &&
            !!sessionPool && sessionPool.configuredMax===4 && !!communityPool && communityPool.configuredMax===4;
          const out = {
            schema:"b1-c42-analysis-v1",
            load:{executions,loadRc,evidenceValid},
            correctness,
            performance,
            thresholdVerdicts,
            throughput:{...throughput,testDurationSeconds},
            baseline,
            sessionStorePool:sessionPool,
            communityPool,
            application:{
              cpuMaxPct:cpuMax,
              cpuMeanPct:cpuN?cpuSum/cpuN:null,
              rssMaxMb:rssMaxKb/1024,
              heapUsedMaxMb:heapUsedMax/1048576,
              heapTotalMaxMb:heapTotalMax/1048576,
              eventLoopP99MaxMs:eventLoopP99Max,
              activeRequestsMax,
              genericPoolWaitMaxMs:genericPoolWaitMax,
            },
            postgres:pg,
            comparison,
            performanceVerdict:evidenceValid ? (perfPass ? "B1-100VU-PASS":"B1-100VU-FAIL") : "B1-C42 HOLD",
          };
          fs.writeFileSync(`${dir}/b1-c42-analysis.json`, JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          NODE
          rc=$?
          echo "analysis_rc=$rc" >> perf/k6/reports/b1-c42-phase-status.txt
          exit 0

      - name: Upload exactly one final C42 evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1-c42-post-c41-100vu-evidence
          path: modern/checkers-engine/perf/k6/reports/
          if-no-files-found: error
          retention-days: 30

      - name: Truthful final C42 evidence-validity gate
        if: always()
        run: |
          set -euo pipefail
          echo '--- C42 PHASE STATUS ---'
          cat perf/k6/reports/b1-c42-phase-status.txt || true
          test "$(cat perf/k6/reports/b1-c42-load-executions.txt 2>/dev/null || echo 0)" = "1" || { echo "B1-C42 HOLD: benchmark not executed exactly once"; exit 92; }
          rc="$(cat perf/k6/reports/b1-c42-load-rc.txt 2>/dev/null || echo -1)"
          test "$rc" = "0" -o "$rc" = "99" || { echo "B1-C42 HOLD: invalid load exit $rc"; exit 93; }
          test -s perf/k6/reports/b1-c42-analysis.json || { echo "B1-C42 HOLD: analysis missing"; exit 94; }
          node - <<'NODE'
          const fs=require("node:fs");
          const x=JSON.parse(fs.readFileSync("perf/k6/reports/b1-c42-analysis.json","utf8"));
          if(!x.load?.evidenceValid) process.exit(95);
          console.log("C42_PERFORMANCE_VERDICT="+x.performanceVerdict);
          if(x.performanceVerdict!=="B1-100VU-PASS" && x.performanceVerdict!=="B1-100VU-FAIL") process.exit(96);
          console.log("C42_EVIDENCE_VALID=true");
          console.log("250_VU_GATE="+(x.performanceVerdict==="B1-100VU-PASS"?"ELIGIBLE_FOR_LEAD_AUTHORIZATION":"BLOCKED"));
          NODE
