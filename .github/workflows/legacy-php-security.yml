name: Legacy PHP Security Checks

on:
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/legacy-php-security.yml"
  push:
    branches:
      - main
      - feature/checkers-engine-foundation
    paths:
      - "website/**"
      - ".github/workflows/legacy-php-security.yml"

permissions:
  contents: read

concurrency:
  group: legacy-php-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install PHP CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli
      - name: Lint all PHP files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find website -type f -name '*.php' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP files found"
            exit 1
          fi
          for file in "${files[@]}"; do
            php -l "$file"
          done
      - name: Reject committed secret files
        shell: bash
        run: |
          set -euo pipefail
          if find website -type f \( -name '.htpasswd' -o -name '.env' -o -name '.env.*' \) -print -quit | grep -q .; then
            echo 'Secret file detected in website/' >&2
            exit 1
          fi
      - name: Reject obvious legacy secret assignments
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          pattern = re.compile(r"\$(facebook_app_secret|database_password|seed_private)\s*=\s*(['\"])(?!\s*getenv\b)(?!\s*\$)[^\n]*?\2", re.I)
          hits = []
          for path in pathlib.Path('website').rglob('*.php'):
              text = path.read_text(encoding='utf-8', errors='ignore')
              for lineno, line in enumerate(text.splitlines(), 1):
                  if pattern.search(line):
                      hits.append(f"{path}:{lineno}:{line.strip()}")
          if hits:
              print('Potential hard-coded secret assignment detected', file=sys.stderr)
              print('\n'.join(hits), file=sys.stderr)
              sys.exit(1)
          PY
