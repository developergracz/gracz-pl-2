name: B1-C19 Focused Validation

on:
  push:
    branches:
      - fix/wave-b-b1-c19-lobby-state-single-acquisition
    paths:
      - 'modern/checkers-engine/src/lobby.js'
      - 'modern/checkers-engine/test/wave-b-b1-c19-lobby-state-single-acquisition.test.js'
      - 'modern/checkers-engine/test/wave-b-b1-c17-lobby-state-client-reuse.test.js'
      - '.github/workflows/b1-c19-focused-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gracz_b1_c19
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gracz_b1_c19"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: modern/checkers-engine
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_b1_c19
      P1_C_01_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_b1_c19
      P1_U_02_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_b1_c19
      P1_U_02_REQUIRE_POSTGRES: '1'
      WAVE_B_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_b1_c19
      POSTGRES_POOL_BUDGET: '64'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify authorized identity, scope and frozen invariants
        run: |
          set -euo pipefail
          BASE=749460b5eabaa94d61ccb22e6b7d0493be8b3b37
          test "$(git rev-parse ${BASE}^{tree})" = "5714fe0be06719e9a4cc2e605b9c34482975bb68"
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --exit-code "$BASE" HEAD -- \
            src/distributed-infrastructure.js \
            src/distributed-global-chat.js \
            src/postgres-session-store.js \
            src/platform-lobby-http.js \
            perf/k6/scenarios/_runner.js
          unexpected="$(git diff --name-only "$BASE" HEAD | grep -Ev '^(modern/checkers-engine/src/lobby\.js|modern/checkers-engine/test/wave-b-b1-c19-lobby-state-single-acquisition\.test\.js|modern/checkers-engine/test/wave-b-b1-c17-lobby-state-client-reuse\.test\.js|\.github/workflows/b1-c19-focused-validation\.yml)$' || true)"
          test -z "$unexpected"
          grep -q 'max: 4' src/postgres-session-store.js
          grep -q 'connectionTimeoutMillis: 10_000' src/postgres-session-store.js
          grep -q 'const MAX_BATCH_REQUESTS = 64;' src/distributed-infrastructure.js
          grep -q 'const MAX_BATCH_KEYS = 256;' src/distributed-infrastructure.js
          grep -q 'const MAX_BATCH_WAIT_MS = 4;' src/distributed-infrastructure.js
          grep -q 'const MAX_QUEUE_DEPTH = 512;' src/distributed-infrastructure.js
          grep -q 'const OPERATION_TIMEOUT_MS = 1_500;' src/distributed-infrastructure.js
          grep -q 'body?.duplicate===false' perf/k6/scenarios/_runner.js
          ! grep -q 'wave-b-runner.sh' ../../.github/workflows/b1-c19-focused-validation.yml
          ! grep -q 'WAVE_B_VUS' ../../.github/workflows/b1-c19-focused-validation.yml
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Reset isolated PostgreSQL database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
      - name: Static C19 validation
        run: |
          set -euo pipefail
          node --check src/lobby.js
          node --check test/wave-b-b1-c19-lobby-state-single-acquisition.test.js
          node --check test/wave-b-b1-c17-lobby-state-client-reuse.test.js
          grep -q 'WITH touched AS' src/lobby.js
          grep -q 'RETURNING user_id,display_name,seen_at' src/lobby.js
          grep -q "WHERE user_id<>\$1 AND seen_at>=NOW()-INTERVAL '45 seconds'" src/lobby.js
      - name: Focused C19 and Lobby PostgreSQL validation
        run: |
          node --test --test-concurrency=1 \
            test/wave-b-b1-c19-lobby-state-single-acquisition.test.js \
            test/wave-b-b1-c17-lobby-state-client-reuse.test.js \
            test/advanced-scalability-wave-a-f02-lobby-postgres.test.js \
            test/advanced-scalability-wave-a-c6-lobby-atomic-start.test.js \
            test/auth-lobby.test.js
      - name: Checkers CAS ownership idempotency and MatchRuntime regression
        run: |
          node --test --test-concurrency=1 \
            test/p1-c-01-cas.test.js \
            test/p1-c-01-postgres-cas.test.js \
            test/p1-c-01-concurrent-http-postgres.test.js \
            test/p1-u-02-checkers-runtime.test.js \
            test/p1-u-02-match-runtime-postgres.test.js
      - name: C13 C14 C16 C17 C02 regression
        run: |
          node --test --test-concurrency=1 \
            test/wave-b-b1-c13-metric-accounting.test.js \
            test/wave-b-b1-c14-per-game-write-counters.test.js \
            test/wave-b-b1-c16-traffic-guard-coalescing.test.js \
            test/wave-b-b1-c17-lobby-state-client-reuse.test.js \
            test/wave-b-b1-c17-c02-checkers-durability-attribution.test.js
      - name: Security regression
        run: |
          node --test --test-concurrency=1 \
            test/security-foundation.test.js \
            test/persistence-security.test.js \
            test/p1-u-02-p7-f01-privacy.test.js \
            test/p1-aud3-01-runtime-contract.test.js \
            test/p1-aud3-01-shared-infrastructure.test.js
