name: Multiplayer scaling
on:
  pull_request:
    paths:
      - 'contact-api/auth/**'
      - 'contact-api/scaling/**'
      - 'contact-api/package*.json'
      - 'contact-api/server.mjs'
      - 'contact-api/test/*realtime*'
      - '.github/workflows/multiplayer-scaling.yml'
permissions:
  contents: read
jobs:
  two-instance-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gracz
          POSTGRES_PASSWORD: local_integration_only
          POSTGRES_DB: gracz_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gracz -d gracz_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
      valkey:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://gracz:local_integration_only@127.0.0.1:5432/gracz_test
      GAME_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: contact-api/package-lock.json
      - run: npm --prefix contact-api ci --ignore-scripts --no-fund --no-audit
      - run: npm --prefix contact-api run test:scaling
      - run: node --test contact-api/scaling/two-agent-checkers.integration.test.mjs
      - name: Install isolated Chromium browser test tooling
        run: |
          npm --prefix contact-api install --no-save --no-package-lock --ignore-scripts --no-fund --no-audit playwright@1.58.2
          ./contact-api/node_modules/.bin/playwright install --with-deps chromium
      - name: Two real Chromium windows play Warcaby by clicking squares
        run: node --test contact-api/scaling/two-chromium-windows.integration.test.mjs
      - name: Two real Chromium windows play Gomoku by clicking stones
        run: node --test contact-api/scaling/two-chromium-gomoku.integration.test.mjs
      - name: Two real Chromium windows play Szachy via WebSocket
        run: node --test contact-api/scaling/two-chromium-chess.integration.test.mjs
      - name: Premium chess SVG desktop, mobile and promotion acceptance
        run: node --test contact-api/scaling/chess-pieces.browser.test.mjs
      - name: Chess owner console (unread badge, five icons, actions, tabs, mobile)
        env:
          CHESS_SCREENSHOT_DIR: contact-api/scaling/owner-console-screenshots
        run: node --test contact-api/scaling/chess-owner-console.browser.test.mjs
      - name: Publish chess owner console acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chess-owner-console-screenshots
          path: contact-api/scaling/owner-console-screenshots/
          if-no-files-found: warn
          retention-days: 7
      - name: Chess drag & drop (mouse, touch) next to click-to-move
        run: node --test contact-api/scaling/chess-drag.browser.test.mjs
      - name: Chess special rules acceptance
        run: node --test contact-api/test/chess-special-rules-acceptance.test.mjs
      - run: node --test contact-api/test/gomoku-realtime.test.mjs contact-api/test/gomoku-realtime-client.test.mjs contact-api/test/gomoku-sync.test.mjs contact-api/test/checkers-realtime.test.mjs contact-api/test/checkers-two-player-match.test.mjs contact-api/test/match-admission.test.mjs contact-api/test/chess-realtime.test.mjs contact-api/test/chess-match.test.mjs contact-api/test/chess-console.test.mjs
