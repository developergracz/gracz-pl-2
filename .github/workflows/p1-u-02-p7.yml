name: P1-U-02 Common Match Runtime

on:
  pull_request:
    branches:
      - main
    paths:
      - modern/checkers-engine/src/match-runtime.js
      - modern/checkers-engine/src/checkers-match-runtime-adapter.js
      - modern/checkers-engine/src/postgres-session-store.js
      - modern/checkers-engine/test/p1-u-02-match-runtime-postgres.test.js
      - modern/checkers-engine/test/p1-u-02-checkers-runtime.test.js
      - modern/checkers-engine/test/p1-u-02-p7-f01-privacy.test.js
      - modern/checkers-engine/test/p1-u-02-p7-f02-projection-contract.test.js
      - .github/workflows/p1-u-02-p7.yml
  push:
    branches:
      - fix/p1-u-02-common-match-runtime-p7
    paths:
      - modern/checkers-engine/src/match-runtime.js
      - modern/checkers-engine/src/checkers-match-runtime-adapter.js
      - modern/checkers-engine/src/postgres-session-store.js
      - modern/checkers-engine/test/p1-u-02-match-runtime-postgres.test.js
      - modern/checkers-engine/test/p1-u-02-checkers-runtime.test.js
      - modern/checkers-engine/test/p1-u-02-p7-f01-privacy.test.js
      - modern/checkers-engine/test/p1-u-02-p7-f02-projection-contract.test.js
      - .github/workflows/p1-u-02-p7.yml

permissions:
  contents: read
  security-events: write

jobs:
  common-match-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gracz
          POSTGRES_PASSWORD: gracz_test
          POSTGRES_DB: gracz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gracz -d gracz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: modern/checkers-engine
    env:
      P1_U_02_DATABASE_URL: postgresql://gracz:gracz_test@127.0.0.1:5432/gracz_test
      P1_U_02_REQUIRE_POSTGRES: "1"
      P1_C_01_DATABASE_URL: postgresql://gracz:gracz_test@127.0.0.1:5432/gracz_test
      P1_AUD3_01_DATABASE_URL: postgresql://gracz:gracz_test@127.0.0.1:5432/gracz_test
      P1_AUD3_01_REQUIRE_POSTGRES: "1"
      P1_AUD3_03_DATABASE_URL: postgresql://gracz:gracz_test@127.0.0.1:5432/gracz_test
      P1_AUD3_04_DATABASE_URL: postgresql://gracz:gracz_test@127.0.0.1:5432/gracz_test
      P1_AUD3_07_DATABASE_URL: postgresql://gracz:gracz_test@127.0.0.1:5432/gracz_test
      P1_AUD3_07_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts --no-fund --no-audit
      - name: P7 syntax
        run: node --check src/match-runtime.js && node --check src/checkers-match-runtime-adapter.js && node --check src/postgres-session-store.js
      - name: P7 focused real PostgreSQL tests
        run: node --test test/p1-u-02-match-runtime-postgres.test.js test/p1-u-02-checkers-runtime.test.js test/p1-u-02-p7-f01-privacy.test.js test/p1-u-02-p7-f02-projection-contract.test.js
      - name: Existing Checkers CAS regression
        run: node --test test/p1-c-01-postgres-cas.test.js test/p1-c-01-concurrent-http-postgres.test.js test/p1-c-01-http-conflict.test.js
      - name: P6 distributed infrastructure regression
        run: node --test test/p1-aud3-01-shared-infrastructure.test.js test/p1-aud3-01-runtime-contract.test.js test/p1-aud3-01-p6-f01.test.js
      - name: Full Node test suite
        run: npm test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser Checkers and Gomoku
        run: npm run test:browser

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
