name: B1-C32 Focused Cluster-Aware PostgreSQL Budget Validation

on:
  push:
    branches: [fix/wave-b-b1-c32-cluster-aware-postgres-budget-guard]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gracz_b1_c32
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d gracz_b1_c32"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: modern/checkers-engine

    env:
      B1_C32_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_b1_c32
      B1_C31_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_b1_c32
      P1_C_01_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_b1_c32
      P1_AUD3_04_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_b1_c32
      WAVE_B_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_b1_c32
      POSTGRES_POOL_BUDGET: '64'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Exact C31 ancestry and C32 scope
        run: |
          set -euo pipefail
          BASE=81914788ef6836e3d8b09b9c5fed4f6fe855ddd2
          TREE=b725f53285e92446661ca39f0b05223eaf2adbc4
          SOURCE=fix/wave-b-b1-c31-secureaccounts-identity-pool-sharing
          git fetch origin "refs/heads/${SOURCE}:refs/remotes/origin/b1-c32-authorized-source"
          test "$(git rev-parse refs/remotes/origin/b1-c32-authorized-source)" = "$BASE"
          test "$(git rev-parse ${BASE}^{tree})" = "$TREE"
          git merge-base --is-ancestor "$BASE" HEAD
          unexpected="$(git diff --name-only "$BASE" HEAD | grep -Ev '^(modern/checkers-engine/src/postgres-pool-budget\.cjs|modern/checkers-engine/src/config\.js|modern/checkers-engine/src/start\.js|modern/checkers-engine/src/postgres-startup-schema-lock\.js|modern/checkers-engine/test/wave-b-b1-c32-cluster-aware-postgres-budget-guard\.test\.js|\.github/workflows/b1-c32-focused-validation\.yml)$' || true)"
          test -z "$unexpected"

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Static syntax and frozen-source gate
        run: |
          set -euo pipefail
          node --check src/postgres-pool-budget.cjs
          node --check src/pg-secure-preload.cjs
          node --check src/config.js
          node --check src/start.js
          node --check src/postgres-startup-schema-lock.js
          node --check test/wave-b-b1-c32-cluster-aware-postgres-budget-guard.test.js

          BASE=81914788ef6836e3d8b09b9c5fed4f6fe855ddd2
          git diff --exit-code "$BASE" HEAD --             src/main.js             src/secure-accounts.js             src/postgres-accounts.js             src/postgres-session-store.js             src/distributed-infrastructure.js             src/distributed-global-chat.js             src/rankings.js             src/ranking-materialization.js             src/auth-sessions.js             src/message-attachments.js             src/audit-service.js             src/moderation-service.js             src/rbac-service.js             src/mfa-service.js             src/tournaments.js             src/newsletter.js             src/newsletter-admin-service.js             src/newsletter-lifecycle-recorder.js             src/thousand-repository.js             src/thousand-realtime.js             src/postgres-gomoku-service.js             src/gomoku-realtime.js             perf

      - name: C32 canonical profile cluster gate and real PostgreSQL startup proof
        run: |
          node --require ./src/pg-secure-preload.cjs --test --test-concurrency=1             test/wave-b-b1-c32-cluster-aware-postgres-budget-guard.test.js

      - name: Configuration regression
        run: node --test --test-concurrency=1 test/config.test.js

      - name: C31 canonical identity-pool regression
        run: |
          node --require ./src/pg-secure-preload.cjs --test --test-concurrency=1             test/wave-b-b1-c31-secureaccounts-identity-pool-sharing.test.js

      - name: SessionStore startup concurrency regression
        run: node --test --test-concurrency=1 test/p1-c-01-startup-concurrency.test.js

      - name: TrafficGuard initialization and batching regression
        env:
          B1_C16_REQUIRE_POSTGRES: '1'
        run: node --test --test-concurrency=1 test/wave-b-b1-c16-traffic-guard-coalescing.test.js

      - name: GlobalChat dedicated-listener regression
        run: node --test --test-concurrency=1 test/wave-b-b1-c22-global-chat-listen-isolation.test.js

      - name: Realtime recovery regression
        run: node --test --test-concurrency=1 test/advanced-scalability-wave-a-c4-realtime-recovery.test.js

      - name: Audit initialization regression
        run: node --test --test-concurrency=1 test/wave-b-audit-init-postgres.test.js

      - name: Gomoku PostgreSQL initialization regression
        run: node --test --test-concurrency=1 test/p1-aud3-04-gomoku-postgres.test.js

      - name: Final no-load scope gate
        run: |
          set -euo pipefail
          BASE=81914788ef6836e3d8b09b9c5fed4f6fe855ddd2
          git diff --exit-code "$BASE" HEAD -- perf
          test "$(grep -Ec 'new[[:space:]]+(pg\.)?Pool[[:space:]]*\(' src/secure-accounts.js || true)" -eq 0
          grep -Fq 'this.pool = baseService.pool;' src/secure-accounts.js
          grep -A8 -F 'this.pool = new Pool({' src/postgres-accounts.js | grep -Fq 'max: 5'
          grep -A8 -F 'this.pool = new Pool({' src/postgres-session-store.js | grep -Fq 'max: 4'
