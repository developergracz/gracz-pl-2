name: GRACZ Performance Autopilot R1

on:
  pull_request:
    paths:
      - "scripts/performance-autopilot.mjs"
      - "scripts/performance-observer.mjs"
      - "scripts/performance-autopilot.test.mjs"
      - ".github/workflows/performance-autopilot.yml"
  workflow_dispatch:
  schedule:
    - cron: "43 */6 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gracz-performance-autopilot-main
  cancel-in-progress: false

jobs:
  test:
    name: Safe performance repair tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - name: Verify code and repairs
        run: |
          node --check scripts/performance-autopilot.mjs
          node --check scripts/performance-observer.mjs
          node --test scripts/performance-autopilot.test.mjs
          node scripts/check-maintenance-seo.mjs
          node scripts/check-seo-auto-indexing.mjs
          node scripts/check-security-headers.mjs

  autopilot:
    name: Observe LCP and self-repair only approved regressions
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - name: Measure production LCP (fail closed when provider unavailable)
        env:
          SEO_PAGESPEED_API_KEY: ${{ secrets.SEO_PAGESPEED_API_KEY }}
          PERF_REPORT_PATH: performance-report.json
        run: node scripts/performance-observer.mjs
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gracz-performance-sample-${{ github.run_id }}
          path: performance-report.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Repair only known, safe source regressions
        run: |
          node scripts/performance-autopilot.mjs --fix
          node scripts/performance-autopilot.mjs
          node scripts/check-maintenance-seo.mjs
          node scripts/check-seo-auto-indexing.mjs
          node scripts/check-security-headers.mjs
          node --test scripts/performance-autopilot.test.mjs
      - name: Keep repairs restricted to approved public HTML files
        id: changes
        run: |
          if git diff --quiet -- maintenance-site; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only | grep -Ev '^maintenance-site/(index.html|gry-karciane/index.html|o-gracz-pl/index.html|gry(/[^/]+(/zasady)?)?/index.html|poradniki/index.html)$'; then
            echo "::error::Unexpected file changed; refusing to publish"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Propose safe repair through GitHub pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="automation/perf-safe-fix-${{ github.run_id }}"
          git config user.name "gracz-performance-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add maintenance-site
          git commit -m "fix(perf): restore approved LCP resource hints and deferred modal CSS"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --repo "${{ github.repository }}" --head "$branch" --base main \
            --title "fix(perf): automatic safe LCP regression repair" \
            --body "Automated bounded repair only. The workflow has run idempotency, SEO/indexability and security-header tests. Production deploy is deliberately held until PR checks and deployment authorization. No account, newsletter, game or API code was modified."
      - name: Summarize outcome
        if: always()
        run: |
          {
            echo ""
            echo "R1 modifies only allowlisted static resource hints, never arbitrary code."
            echo "Generated PRs are not merged or deployed automatically."
            echo "No performance conclusions are drawn from missing or throttled PageSpeed results."
          } >> "$GITHUB_STEP_SUMMARY"
