name: GRACZ Performance Guardian R3 (bez AI API)

on:
  pull_request:
    paths:
      - "scripts/performance-autopilot.mjs"
      - "scripts/performance-observer.mjs"
      - "scripts/performance-free-guardian.mjs"
      - "scripts/performance-free-guardian.test.mjs"
      - "scripts/performance-lighthouse-fallback.mjs"
      - "scripts/performance-lighthouse-fallback.test.mjs"
      - "scripts/performance-autopilot.test.mjs"
      - "scripts/performance-autopilot-r2.test.mjs"
      - "scripts/performance-ai-advisor.mjs"
      - "scripts/performance-render-deploy.mjs"
      - "scripts/performance-rollback-stage.mjs"
      - "scripts/performance-rollback-stage.test.mjs"
      - ".github/workflows/performance-rollback-stage.yml"
      - ".github/workflows/performance-autopilot.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/performance-autopilot*.mjs"
      - "scripts/performance-observer.mjs"
      - "scripts/performance-free-guardian.mjs"
      - "scripts/performance-free-guardian.test.mjs"
      - "scripts/performance-lighthouse-fallback.mjs"
      - "scripts/performance-lighthouse-fallback.test.mjs"
      - "scripts/performance-ai-advisor.mjs"
      - "scripts/performance-render-deploy.mjs"
      - "scripts/performance-rollback-stage.mjs"
      - "scripts/performance-rollback-stage.test.mjs"
      - ".github/workflows/performance-rollback-stage.yml"
      - ".github/workflows/performance-autopilot.yml"
  workflow_dispatch:
  schedule:
    - cron: "43 */6 * * *"

permissions:
  contents: read

concurrency:
  group: gracz-performance-autopilot-main
  cancel-in-progress: false

jobs:
  test:
    name: Safe performance repair tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - name: Verify code and repairs
        run: |
          node --check scripts/performance-autopilot.mjs
          node --check scripts/performance-observer.mjs
          node --check scripts/performance-free-guardian.mjs
          node --check scripts/performance-lighthouse-fallback.mjs
          node --check scripts/performance-ai-advisor.mjs
          node --check scripts/performance-render-deploy.mjs
          node --check scripts/performance-rollback-stage.mjs
          node --test scripts/performance-autopilot.test.mjs scripts/performance-autopilot-r2.test.mjs scripts/performance-lighthouse-fallback.test.mjs scripts/performance-free-guardian.test.mjs scripts/performance-rollback-stage.test.mjs
          node scripts/check-maintenance-seo.mjs
          node scripts/check-seo-auto-indexing.mjs
          node scripts/check-security-headers.mjs

  autopilot:
    name: Observe LCP and self-repair only approved regressions
    permissions:
      contents: write
      pull-requests: write
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - name: Local Lighthouse measurements and free rule-based diagnostics
        env:
          PERF_REPORT_PATH: performance-report.json
        run: node scripts/performance-free-guardian.mjs
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gracz-performance-sample-${{ github.run_id }}
          path: performance-report.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Repair only known, safe source regressions
        run: |
          node scripts/performance-autopilot.mjs --fix
          node scripts/performance-autopilot.mjs
          node scripts/check-maintenance-seo.mjs
          node scripts/check-seo-auto-indexing.mjs
          node scripts/check-security-headers.mjs
          node --test scripts/performance-autopilot.test.mjs scripts/performance-autopilot-r2.test.mjs scripts/performance-lighthouse-fallback.test.mjs scripts/performance-free-guardian.test.mjs scripts/performance-rollback-stage.test.mjs
      - name: Keep repairs restricted to approved public HTML files
        id: changes
        run: |
          if git diff --quiet -- maintenance-site; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only | grep -Ev '^maintenance-site/(index.html|gry-karciane/index.html|o-gracz-pl/index.html|gry(/[^/]+(/zasady)?)?/index.html|poradniki/index.html)$'; then
            echo "::error::Unexpected file changed; refusing to publish"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Propose safe repair through GitHub pull request
        id: proposed
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="automation/perf-safe-fix-${{ github.run_id }}"
          git config user.name "gracz-performance-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add maintenance-site
          git commit -m "fix(perf): restore approved LCP resource hints and deferred modal CSS"
          git push origin "HEAD:refs/heads/$branch"
          pr=$(gh pr create --repo "${{ github.repository }}" --head "$branch" --base main \
            --title "fix(perf): automatic safe LCP regression repair" \
            --body "Bounded repair only: in-job unit tests, SEO/indexability, security headers and allowlisted HTML changes. Automatic merge/deploy requires explicit opt-in and Render API credentials; otherwise review before publish.")
          echo "pr_url=$pr" >> "$GITHUB_OUTPUT"
      - name: Autopublish allowlisted repair with verified Render rollback
        if: steps.proposed.outputs.pr_url != '' && vars.GRACZ_PERF_AUTO_PUBLISH == 'enabled' && vars.GRACZ_PERF_ROLLBACK_TESTED == 'enabled'
        env:
          GH_TOKEN: ${{ github.token }}
          RENDER_AUTOPILOT_API_KEY: ${{ secrets.RENDER_AUTOPILOT_API_KEY }}
          PERF_AUTOPILOT_AUTO_PUBLISH: enabled
        run: |
          set -euo pipefail
          if [ -z "$RENDER_AUTOPILOT_API_KEY" ]; then
            echo "::error::Missing Render API credential; PR remains pending."
            exit 1
          fi
          current="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$current" != "${{ github.sha }}" ]; then
            echo "::error::Main changed during the check; refusing to merge or deploy."
            exit 1
          fi
          pr="${{ steps.proposed.outputs.pr_url }}"
          head="$(gh pr view "$pr" --repo "${{ github.repository }}" --json headRefOid --jq '.headRefOid')"
          if ! [[ "$head" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Cannot verify exact repair PR head SHA."
            exit 1
          fi
          # Require independent CI on the exact repair head; GitHub Actions
          # normally suppresses PR workflows when the PR uses GITHUB_TOKEN.
          # In that situation leave the PR open, NEVER silently auto-merge.
          checks="$(gh api --method GET "repos/${{ github.repository }}/commits/$head/check-runs" -F per_page=100)"
          for job in "codeql" "secrets" "node-security" "contact-api-security" "Validate site SEO"; do
            passed="$(jq -r --arg job "$job" '[.check_runs[] | select(.name==$job and .status=="completed" and .conclusion=="success")] | length' <<< "$checks")"
            if [ "$passed" -lt 1 ]; then
              echo "::error::Missing successful independent CI check: $job. PR kept open."
              exit 1
            fi
          done
          gh pr merge "$pr" --repo "${{ github.repository }}" --squash
          sha="$(gh pr view "$pr" --repo "${{ github.repository }}" --json mergeCommit --jq '.mergeCommit.oid')"
          if ! [[ "$sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Cannot verify merged commit."
            exit 1
          fi
          export PERF_AUTOPILOT_COMMIT_SHA="$sha"
          node scripts/performance-render-deploy.mjs
      - name: Summarize outcome
        if: always()
        run: |
          {
            echo ""
            echo "R1 modifies only allowlisted static resource hints, never arbitrary code."
            echo "Automatic publication requires verified staging rollback, explicit opt-in, Render secret, and independent PR CI checks; otherwise PR only."
            echo "R3 uses local Lighthouse and fixed rules; it never calls OpenAI or PageSpeed APIs. Missing data cannot trigger repairs."
          } >> "$GITHUB_STEP_SUMMARY"
