name: Gate 12 runtime evidence

on:
  push:
    branches:
      - feature/homepage-game-center
    paths:
      - modern/checkers-engine/package.json

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Poll privacy-safe Gate 12 endpoint
        shell: bash
        run: |
          set -euo pipefail
          url='https://gracz-checkers-test.onrender.com/__g12_20260829_56b8798f450d1e91da6b245999b25e814fa8318ed23420fd'
          rm -f gate12-runtime-result.json
          for i in $(seq 1 90); do
            if curl -fsS --max-time 15 "$url" -o gate12-runtime-result.json; then
              python - <<'PY'
import json
from pathlib import Path
p=Path('gate12-runtime-result.json')
data=json.loads(p.read_text())
if data.get('test') != 'gate12-identity-key-mapping-runtime-v1' or data.get('readOnly') is not True:
    raise SystemExit('unexpected Gate 12 payload')
print(json.dumps(data, indent=2, sort_keys=True))
PY
              exit 0
            fi
            sleep 10
          done
          echo 'Gate 12 endpoint did not become available' >&2
          exit 1
      - name: Upload Gate 12 evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate12-runtime-evidence
          path: gate12-runtime-result.json
          if-no-files-found: error
          retention-days: 1
