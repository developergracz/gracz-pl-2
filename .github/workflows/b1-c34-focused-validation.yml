name: B1-C34 Focused MessageAttachment Account Pool Validation

on:
  push:
    branches: [fix/wave-b-b1-c34-message-attachment-account-pool-sharing]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gracz_b1_c34
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d gracz_b1_c34"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: modern/checkers-engine

    env:
      B1_C34_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_b1_c34
      B1_C33_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_b1_c34
      B1_C32_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_b1_c34
      B1_C31_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_b1_c34
      P1_C_01_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_b1_c34
      POSTGRES_POOL_BUDGET: '64'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Exact C33 ancestry source identity and C34 scope
        run: |
          set -euo pipefail
          BASE=5c8bca095df35ea002304849f5bd6419ebff2026
          TREE=a31a6a5497f88b26f1c95ee19383ee51e01e91fe
          test "$(git rev-parse ${BASE}^{tree})" = "$TREE"
          git merge-base --is-ancestor "$BASE" HEAD
          unexpected="$(git diff --name-only "$BASE" HEAD | grep -Ev '^(modern/checkers-engine/src/message-attachments\.js|modern/checkers-engine/src/main\.js|modern/checkers-engine/src/postgres-pool-budget\.cjs|modern/checkers-engine/test/wave-b-b1-c32-cluster-aware-postgres-budget-guard\.test\.js|modern/checkers-engine/test/wave-b-b1-c33-auth-session-identity-pool-sharing\.test\.js|modern/checkers-engine/test/wave-b-b1-c34-message-attachment-account-pool-sharing\.test\.js|\.github/workflows/b1-c34-focused-validation\.yml)$' || true)"
          test -z "$unexpected"
          git diff --exit-code "$BASE" HEAD -- modern/checkers-engine/perf

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Static syntax gate
        run: |
          set -euo pipefail
          node --check src/message-attachments.js
          node --check src/main.js
          node --check src/postgres-pool-budget.cjs
          node --check test/wave-b-b1-c32-cluster-aware-postgres-budget-guard.test.js
          node --check test/wave-b-b1-c33-auth-session-identity-pool-sharing.test.js
          node --check test/wave-b-b1-c34-message-attachment-account-pool-sharing.test.js

      - name: C34 real PostgreSQL ownership attachment correctness concurrency shutdown
        run: |
          node --require ./src/pg-secure-preload.cjs --test --test-concurrency=1 \
            test/wave-b-b1-c34-message-attachment-account-pool-sharing.test.js

      - name: C33 AuthSession borrower regression
        run: |
          node --require ./src/pg-secure-preload.cjs --test --test-concurrency=1 \
            test/wave-b-b1-c33-auth-session-identity-pool-sharing.test.js

      - name: C31 SecureAccount borrower regression
        run: |
          node --require ./src/pg-secure-preload.cjs --test --test-concurrency=1 \
            test/wave-b-b1-c31-secureaccounts-identity-pool-sharing.test.js

      - name: C32 canonical profile cluster guard preload regression
        run: |
          node --require ./src/pg-secure-preload.cjs --test --test-concurrency=1 \
            test/wave-b-b1-c32-cluster-aware-postgres-budget-guard.test.js

      - name: Authentication account session regressions
        run: |
          node --test --test-concurrency=1 \
            test/auth-session-registry.test.js \
            test/auth-lobby.test.js \
            test/accounts.test.js

      - name: Configuration and startup regressions
        run: |
          node --test --test-concurrency=1 test/config.test.js
          node --test --test-concurrency=1 test/p1-c-01-startup-concurrency.test.js

      - name: Final no-load scope gate
        run: |
          set -euo pipefail
          BASE=5c8bca095df35ea002304849f5bd6419ebff2026
          git diff --exit-code "$BASE" HEAD -- perf
          git diff --exit-code "$BASE" HEAD -- src/postgres-accounts.js src/secure-accounts.js src/auth-sessions.js
