name: Consent browser E2E

on:
  pull_request:
    paths:
      - 'maintenance-site/**'
      - 'tests/consent/**'
      - '.github/workflows/consent-browser-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consent-browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned Playwright runner
        run: npm install --no-save --prefix .consent-e2e @playwright/test@1.56.1
      - name: Verify preinstalled Chrome
        run: google-chrome --version
      - name: Run consent browser tests
        env:
          NODE_PATH: ${{ github.workspace }}/.consent-e2e/node_modules
        run: ./.consent-e2e/node_modules/.bin/playwright test --config=tests/consent/playwright.config.cjs
      - name: Capture R2 hero screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-r2-responsive-screenshots
          path: |
            test-results/home-r2/*.png
            test-results/home-r3/*.png
          if-no-files-found: ignore
          retention-days: 7
