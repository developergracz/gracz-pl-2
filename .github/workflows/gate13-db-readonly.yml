name: Gate 13 DB read-only

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gate13-db-readonly.yml"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_URL_1: ${{ secrets.DATABASE_URL }}
      DB_URL_2: ${{ secrets.RENDER_DATABASE_URL }}
      DB_URL_3: ${{ secrets.POSTGRES_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Select configured database secret without printing it
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${DB_URL_1:-}" ]; then
            echo "DATABASE_URL=${DB_URL_1}" >> "$GITHUB_ENV"
          elif [ -n "${DB_URL_2:-}" ]; then
            echo "DATABASE_URL=${DB_URL_2}" >> "$GITHUB_ENV"
          elif [ -n "${DB_URL_3:-}" ]; then
            echo "DATABASE_URL=${DB_URL_3}" >> "$GITHUB_ENV"
          else
            echo "No configured DATABASE_URL / RENDER_DATABASE_URL / POSTGRES_URL secret." >&2
            exit 78
          fi
      - name: Execute Gate 13 collector in read-only transaction
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -P pager=off \
            -f "Nowa dokumentacja Gracz.pl/03-MIGRACJA/22-GATE-13-ACTIVE-STATE-INVENTORY.sql" \
            | tee gate13-db-results.txt
      - name: Upload aggregate evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gate13-db-readonly-evidence
          path: gate13-db-results.txt
          retention-days: 1
