name: B1-C38 Community Pool Isolation

on:
  push:
    branches:
      - fix/wave-b-b1-c38-community-pool-isolation
    paths:
      - '.github/workflows/b1-c38-community-pool-isolation.yml'

permissions:
  contents: read

jobs:
  b1-c38-community-pool-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gracz_wave_b
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gracz_wave_b"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: modern/checkers-engine

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_wave_b
      B1_C32_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_wave_b
      P1_C_01_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_wave_b
      POSTGRES_POOL_BUDGET: '64'

    steps:
      - name: Checkout exact C38 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Initialize focused evidence
        run: |
          set -euo pipefail
          mkdir -p perf/k6/reports
          : > perf/k6/reports/b1-c38-phase-status.txt

      - name: Generate isolated masked test secrets
        run: |
          set -euo pipefail
          for name in AUTH_SECRET MESSAGE_ENCRYPTION_KEY ATTACHMENT_ENCRYPTION_KEY MFA_ENCRYPTION_KEY; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Install dependencies
        id: deps
        continue-on-error: true
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify PostgreSQL fixture
        id: fixture
        if: steps.deps.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          command -v psql
          test "$(psql "$DATABASE_URL" -Atc 'SHOW max_connections;')" = "100"
          test "$(psql "$DATABASE_URL" -Atc 'SHOW superuser_reserved_connections;')" = "3"
          psql "$DATABASE_URL" -Atc "SELECT version(); SHOW max_connections; SHOW reserved_connections; SHOW superuser_reserved_connections;"             | tee perf/k6/reports/b1-c38-postgres-fixture.txt

      - name: Verify exact C37 source ancestry and C38 scope
        id: identity
        if: steps.fixture.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          BASE=acc2c035f6d36146f92174329ee2d534de153de4
          BASE_TREE=04ebe352ad0fe5288a08c370e7dd7df8f8d8c23f
          test "$(git rev-parse ${BASE}^{tree})" = "$BASE_TREE"
          git merge-base --is-ancestor "$BASE" HEAD
          unexpected="$(git diff --name-only "$BASE" HEAD | grep -Ev '^(modern/checkers-engine/src/postgres-community-pool\.js|modern/checkers-engine/src/main\.js|modern/checkers-engine/src/postgres-pool-budget\.cjs|modern/checkers-engine/test/wave-b-b1-c32-cluster-aware-postgres-budget-guard\.test\.js|modern/checkers-engine/test/wave-b-b1-c38-community-pool-isolation\.test\.js|\.github/workflows/b1-c38-community-pool-isolation\.yml)$' || true)"
          test -z "$unexpected"
          {
            echo "repository=developergracz/gracz-pl-2"
            echo "source_branch=diag/wave-b-b1-c37-sessionstore-shared-pool-attribution"
            echo "source_head=$BASE"
            echo "source_tree=$BASE_TREE"
            echo "c38_branch=fix/wave-b-b1-c38-community-pool-isolation"
            echo "tested_head=$(git rev-parse HEAD)"
            echo "tested_tree=$(git rev-parse HEAD^{tree})"
            echo "merge_base=$(git merge-base "$BASE" HEAD)"
            echo "ahead=$(git rev-list --count ${BASE}..HEAD)"
            echo "behind=$(git rev-list --count HEAD..${BASE})"
            echo "changed_files:"
            git diff --name-only "$BASE" HEAD
          } | tee perf/k6/reports/b1-c38-identity.txt

      - name: Syntax checks
        id: syntax
        if: steps.identity.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          node --check src/postgres-community-pool.js
          node --check src/main.js
          node --check src/postgres-pool-budget.cjs
          node --check test/wave-b-b1-c32-cluster-aware-postgres-budget-guard.test.js
          node --check test/wave-b-b1-c38-community-pool-isolation.test.js
          echo "syntax=PASS" | tee perf/k6/reports/b1-c38-syntax.txt

      - name: C38 focused Community isolation
        id: c38
        if: steps.syntax.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          node --require ./src/pg-secure-preload.cjs --test --test-concurrency=1             test/wave-b-b1-c38-community-pool-isolation.test.js             2>&1 | tee perf/k6/reports/b1-c38-focused.log

      - name: C19 lobby state invariant
        id: c19
        if: steps.c38.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          node --require ./src/pg-secure-preload.cjs --test --test-concurrency=1             test/wave-b-b1-c19-lobby-state-single-acquisition.test.js             2>&1 | tee perf/k6/reports/b1-c38-c19.log

      - name: C22 GlobalChat listener isolation
        id: c22
        if: steps.c19.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          node --require ./src/pg-secure-preload.cjs --test --test-concurrency=1             test/wave-b-b1-c22-global-chat-listen-isolation.test.js             2>&1 | tee perf/k6/reports/b1-c38-c22.log

      - name: C25 lobby room invariant
        id: c25
        if: steps.c22.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          node --require ./src/pg-secure-preload.cjs --test --test-concurrency=1             test/wave-b-b1-c25-lobby-room-single-acquisition.test.js             2>&1 | tee perf/k6/reports/b1-c38-c25.log

      - name: C27 GlobalChat presence invariant
        id: c27
        if: steps.c25.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          node --require ./src/pg-secure-preload.cjs --test --test-concurrency=1             test/wave-b-b1-c27-global-chat-presence-single-acquisition.test.js             2>&1 | tee perf/k6/reports/b1-c38-c27.log

      - name: C32 canonical connection-budget regression
        id: c32
        if: steps.c27.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          node --require ./src/pg-secure-preload.cjs --test --test-concurrency=1             test/wave-b-b1-c32-cluster-aware-postgres-budget-guard.test.js             2>&1 | tee perf/k6/reports/b1-c38-c32.log

      - name: Relevant Lobby and GlobalChat regressions
        id: related
        if: steps.c32.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          node --require ./src/pg-secure-preload.cjs --test --test-concurrency=1             test/advanced-scalability-wave-a-c5-global-chat-admission.test.js             test/advanced-scalability-wave-a-f02-lobby-postgres.test.js             test/auth-lobby.test.js             test/wave-b-b1-c17-lobby-state-client-reuse.test.js             2>&1 | tee perf/k6/reports/b1-c38-related.log

      - name: Verify canonical post-C38 connection profile
        id: profile
        if: steps.related.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          node <<'NODE' | tee perf/k6/reports/b1-c38-resource-profile.json
          const b = require('./src/postgres-pool-budget.cjs');
          const profile = b.POSTGRES_RESOURCE_PROFILE;
          const community = profile.pools.filter((entry) => entry.owner === 'PostgresCommunityPool');
          if (profile.pools.length !== 15) process.exit(41);
          if (community.length !== 1 || community[0].max !== 4) process.exit(42);
          if (b.aggregatePoolMax() !== 52) process.exit(43);
          if (b.aggregateExternalPersistentClients() !== 1) process.exit(44);
          if (b.aggregateStartupTemporaryClients() !== 1) process.exit(45);
          const fixture = {
            maxConnections: 100,
            reservedConnections: 0,
            superuserReservedConnections: 3,
            operationalHeadroom: 10,
            environment: { POSTGRES_POOL_BUDGET: '64' },
          };
          const one = b.connectionBudgetPlan({ ...fixture, replicaCount: 1 });
          const two = b.connectionBudgetPlan({ ...fixture, replicaCount: 2 });
          if (one.safeApplicationCapacity !== 87 || one.steadyEnvelope !== 53 || one.startupEnvelope !== 54 || !one.safe) process.exit(46);
          if (two.steadyEnvelope !== 106 || two.startupEnvelope !== 108 || two.safe) process.exit(47);
          console.log(JSON.stringify({
            physicalPoolOwners: profile.pools.length,
            aggregatePoolMax: b.aggregatePoolMax(),
            externalPersistent: b.aggregateExternalPersistentClients(),
            startupTemporary: b.aggregateStartupTemporaryClients(),
            community: community[0],
            oneReplica: {
              steady: one.steadyEnvelope,
              startup: one.startupEnvelope,
              safeCapacity: one.safeApplicationCapacity,
              safe: one.safe,
            },
            twoReplicas: {
              steady: two.steadyEnvelope,
              startup: two.startupEnvelope,
              safeCapacity: two.safeApplicationCapacity,
              safe: two.safe,
            },
          }, null, 2));
          NODE

      - name: Record phase status
        if: always()
        run: |
          {
            echo "deps=${{ steps.deps.outcome }}"
            echo "fixture=${{ steps.fixture.outcome }}"
            echo "identity=${{ steps.identity.outcome }}"
            echo "syntax=${{ steps.syntax.outcome }}"
            echo "c38=${{ steps.c38.outcome }}"
            echo "c19=${{ steps.c19.outcome }}"
            echo "c22=${{ steps.c22.outcome }}"
            echo "c25=${{ steps.c25.outcome }}"
            echo "c27=${{ steps.c27.outcome }}"
            echo "c32=${{ steps.c32.outcome }}"
            echo "related=${{ steps.related.outcome }}"
            echo "profile=${{ steps.profile.outcome }}"
            echo "load_test_executed=NO"
          } >> perf/k6/reports/b1-c38-phase-status.txt
          cat perf/k6/reports/b1-c38-phase-status.txt

      - name: Upload focused C38 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1-c38-community-pool-isolation-evidence
          path: modern/checkers-engine/perf/k6/reports/b1-c38-*
          if-no-files-found: error
          retention-days: 30

      - name: Final C38 gate
        if: always()
        run: |
          set -euo pipefail
          for outcome in             "${{ steps.deps.outcome }}"             "${{ steps.fixture.outcome }}"             "${{ steps.identity.outcome }}"             "${{ steps.syntax.outcome }}"             "${{ steps.c38.outcome }}"             "${{ steps.c19.outcome }}"             "${{ steps.c22.outcome }}"             "${{ steps.c25.outcome }}"             "${{ steps.c27.outcome }}"             "${{ steps.c32.outcome }}"             "${{ steps.related.outcome }}"             "${{ steps.profile.outcome }}"; do
            test "$outcome" = "success"
          done
          echo "B1-C38 focused structural verification PASS; no performance load executed."
