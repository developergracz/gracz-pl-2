name: Warcaby chess-console integration acceptance
on:
  pull_request:
    paths:
      - 'contact-api/auth/checkers-console.mjs'
      - 'contact-api/auth/checkers-chess-shell.mjs'
      - 'contact-api/auth/checkers-ui-parity.mjs'
      - 'contact-api/auth/chess-console.mjs'
      - 'contact-api/scaling/checkers-chess-shell.browser.test.mjs'
      - 'contact-api/test/checkers-console.test.mjs'
      - '.github/workflows/checkers-chess-console-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkers-console:
    name: Existing Warcaby engine in chess console — Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: contact-api/package-lock.json
      - name: Install existing project dependencies and isolated Chromium
        run: |
          npm --prefix contact-api ci --ignore-scripts --no-fund --no-audit
          npm --prefix contact-api install --no-save --no-package-lock --ignore-scripts --no-fund --no-audit playwright@1.58.2
          ./contact-api/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify existing Warcaby source, controllers and rendering
        run: |
          node --test contact-api/test/checkers-console.test.mjs contact-api/test/checkers-training.test.mjs contact-api/test/checkers-rule-regressions.test.mjs
      - name: Verify real desktop/mobile chess console and unchanged Warcaby gameplay
        run: node --test contact-api/scaling/checkers-chess-shell.browser.test.mjs
