name: Gate 13 runtime evidence

on:
  push:
    branches:
      - feature/homepage-game-center
    paths:
      - "modern/checkers-engine/package.json"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Poll privacy-safe Gate 13 endpoint
        shell: bash
        run: |
          set -euo pipefail
          url='https://gracz-checkers-test.onrender.com/__g13_20260829_4f5f8c0b18bd4e12a0b9e74cc8fa43e1'
          rm -f gate13-runtime-result.json
          for i in $(seq 1 120); do
            if curl -fsS --max-time 15 "$url" -o gate13-runtime-result.json; then
              python -c "import json; from pathlib import Path; d=json.loads(Path('gate13-runtime-result.json').read_text()); assert d.get('test') == 'gate13-active-state-runtime-v1'; assert d.get('readOnly') is True; assert d.get('captureStatus') == 'PASS-COLLECTOR'; print(json.dumps(d, indent=2, sort_keys=True))"
              exit 0
            fi
            sleep 10
          done
          echo 'Gate 13 runtime endpoint did not become available' >&2
          exit 1
      - name: Upload Gate 13 runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate13-runtime-evidence
          path: gate13-runtime-result.json
          if-no-files-found: error
          retention-days: 1
