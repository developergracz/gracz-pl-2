name: Security Gate

on:
  push:
    branches: [ main, security-hardening-2026-08 ]
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PHP syntax check
        run: |
          set -euo pipefail
          find website -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Reject committed runtime logs and secret files
        run: |
          set -euo pipefail
          test -z "$(git ls-files 'website/logi/*.log' 'website/logi/*.txt' '*.pem' '*.key' '.env' '.env.*' | grep -v '\.env\.example$' || true)" || {
            echo 'Runtime logs or secret-like files are tracked by git.' >&2
            git ls-files 'website/logi/*.log' 'website/logi/*.txt' '*.pem' '*.key' '.env' '.env.*'
            exit 1
          }

      - name: Basic secret-pattern scan
        run: |
          set -euo pipefail
          if git grep -nEI '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16}|sk_live_[0-9A-Za-z]+|TURNSTILE_SECRET_KEY[[:space:]]*=|DATABASE_PASSWORD[[:space:]]*=|RESEND_API_KEY[[:space:]]*=)' -- ':!*.md' ':!*.example'; then
            echo 'Potential secret detected. Rotate the key and remove it from history before deployment.' >&2
            exit 1
          fi

      - name: Block known obsolete critical legacy components
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r file; do
            echo "Obsolete/high-risk dependency must be upgraded or isolated: $file" >&2
            bad=1
          done < <(find games-dev -type f \( -name 'log4j-1.*.jar' -o -name 'commons-collections-3.2.1.jar' -o -name 'mysql-connector-java-5.1.34-bin.jar' \) -print)
          exit "$bad"

      - name: Ensure security core is present
        run: |
          test -f website/security_core.php
          grep -q 'SecurityConfigureSession' website/security_core.php
          grep -q 'RateLimitCheck' website/security_core.php
