          NODE_OPTIONS="--require=$RUNNER_TEMP/b1-c40-r1-borrower-attribution-preload.cjs" \
          node --input-type=module - <<'NODE' | tee perf/k6/reports/b1-c40-r1-borrower-self-test.json
          import path from "node:path";
          import { setTimeout as delay } from "node:timers/promises";
          const hook = globalThis.__B1_C40R1;
          if (!hook) process.exit(71);
          const root = path.join(process.env.GITHUB_WORKSPACE, "modern", "checkers-engine");
          const source = path.join(root, "src", "postgres-community-pool.js");
          const makePool = new Function("pg", "url", [
            "return new pg.Pool({connectionString:url,max:1,connectionTimeoutMillis:2000});",
            "//# sourceURL=" + source
