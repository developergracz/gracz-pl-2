          function wrapExplicitRelease(client,release,stat,meta){if(!client||typeof release!=="function")return release;const started=meta.acquiredNs||process.hrtime.bigint();let released=false;return function(){if(!released){released=true;const holdMs=Number(process.hrtime.bigint()-started)/1e6;stat.releasesObserved+=1;record(stat.hold,holdMs,null);if(stat.owner==="COMMUNITY_POOL"){record(opStats(stat,meta).hold,holdMs,null);record(consumerStats(stat,meta).hold,holdMs,null);}rawBorrowerEvent("released",meta,{holdMs});attachClientMeta(client,null);}return release.apply(this,arguments);};}
          class C40R1Pool extends OriginalPool{
