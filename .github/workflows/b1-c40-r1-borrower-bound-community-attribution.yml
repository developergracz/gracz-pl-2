          });
          if (callbackResult.rows[0].ok !== 3) process.exit(85);

          const cases = [
            ["at LobbyService.#readStateDatabase (/x/src/lobby.js:109:10)", "LOBBY", "lobby.read_state"],
            ["at LobbyService.#touchUserDatabase (/x/src/lobby.js:103:10)", "LOBBY", "lobby.presence_touch"],
            ["at LobbyService.#listRoomsDatabase (/x/src/lobby.js:120:10)", "LOBBY", "lobby.rooms_read"],
            ["at LobbyService.#listPlayersDatabase (/x/src/lobby.js:130:10)", "LOBBY", "lobby.players_read"],
            ["at LobbyService.#listInvitationsDatabase (/x/src/lobby.js:140:10)", "LOBBY", "lobby.invitations_read"],
            ["at LobbyService.#createRoomForActiveUserDatabase (/x/src/lobby.js:228:10)", "LOBBY", "lobby.room_create_update_transaction"],
            ["at LobbyService.respondInvitation (/x/src/lobby.js:240:10)", "LOBBY", "lobby.invitation_operations"],
            ["at LobbyService.joinRoom (/x/src/lobby.js:250:10)", "LOBBY", "lobby.room_join_update_transaction"],
            ["at GlobalChatService.list (/x/src/global-chat.js:148:10)", "GLOBAL_CHAT", "global_chat.message_list_read"],
            ["at DistributedGlobalChatService.#persistPresence (/x/src/distributed-global-chat.js:233:10)", "GLOBAL_CHAT", "global_chat.presence_touch"],
            ["at DistributedGlobalChatService.#refreshPresence (/x/src/distributed-global-chat.js:243:10)", "GLOBAL_CHAT", "global_chat.presence_read"],
            ["at DistributedGlobalChatService.#notify (/x/src/distributed-global-chat.js:253:10)", "GLOBAL_CHAT", "global_chat.realtime_notify"],
            ["at DistributedGlobalChatService.#recoverSubscriber (/x/src/distributed-global-chat.js:263:10)", "GLOBAL_CHAT", "global_chat.background_realtime_refresh"],
            ["at GlobalChatService.send (/x/src/global-chat.js:168:10)", "GLOBAL_CHAT", "global_chat.message_write"],
            ["at GlobalChatService.edit (/x/src/global-chat.js:178:10)", "GLOBAL_CHAT", "global_chat.message_edit"],
            ["at GlobalChatService.remove (/x/src/global-chat.js:188:10)", "GLOBAL_CHAT", "global_chat.message_delete"],
