              if(fn.endsWith(".send"))return{consumer:"GLOBAL_CHAT",operation:"global_chat.message_write"};
              if(fn.endsWith(".edit"))return{consumer:"GLOBAL_CHAT",operation:"global_chat.message_edit"};
              if(fn.endsWith(".remove"))return{consumer:"GLOBAL_CHAT",operation:"global_chat.message_delete"};
              if(fn.endsWith(".react"))return{consumer:"GLOBAL_CHAT",operation:"global_chat.reaction_write"};
              if(fn.endsWith(".report"))return{consumer:"GLOBAL_CHAT",operation:"global_chat.report_write"};
              if(fn.endsWith(".createTopic"))return{consumer:"GLOBAL_CHAT",operation:"global_chat.topic_write"};
              if(fn.endsWith(".topics")||fn.endsWith(".getTopic"))return{consumer:"GLOBAL_CHAT",operation:"global_chat.topic_read"};
              if(fn.includes("Friend")||fn.endsWith(".friends"))return{consumer:"GLOBAL_CHAT",operation:"global_chat.friend_operations"};
              if(fn.includes("#initialize"))return{consumer:"GLOBAL_CHAT",operation:"global_chat.startup_schema_or_presence_read"};
              return{consumer:"GLOBAL_CHAT",operation:"global_chat.other:"+fn};
            }
            return{consumer:"OTHER_UNKNOWN",operation:"other_unknown"};
          }
          function normalizedRoute(method,rawUrl){let pathname="/";try{pathname=new URL(rawUrl||"/","http://localhost").pathname;}catch{}pathname=pathname.replace(/^\/lobby\/rooms\/[^/]+\/join$/,"/lobby/rooms/:id/join").replace(/^\/lobby\/invitations\/[^/]+\/respond$/,"/lobby/invitations/:id/respond").replace(/^\/global-chat\/messages\/[^/]+$/,"/global-chat/messages/:id").replace(/^\/global-chat\/friends\/[^/]+.*$/,"/global-chat/friends/:id");return String(method||"UNKNOWN").toUpperCase()+" "+pathname;}
          function phaseNow(){if(!workloadStartNs)return"startup";const e=Number(process.hrtime.bigint()-workloadStartNs)/1e9;if(e<120)return"warmup";if(e<420)return"steady";return"cooldown";}
          function increment(map,key,amount){map.set(key,(map.get(key)||0)+(amount||1));}
          function makeOwner(owner,pool){return{owner,pool,configuredMax:Number(pool.options&&pool.options.max||0),peakWaiting:Number(pool.waitingCount||0),acquire:timing(),physicalAcquire:timing(),query:timing(),hold:timing(),physicalAcquisitions:0,borrowerAcquisitions:0,releasesObserved:0,mechanisms:{direct_pool_query:0,explicit_pool_connect:0,unknown:0},operations:new Map(),consumers:new Map(),requestAcquisitions:new Map()};}
          function opStats(stat,meta){const key=meta.consumer+"|"+meta.operation+"|"+meta.phase;let row=stat.operations.get(key);if(!row){row={consumer:meta.consumer,operation:meta.operation,phase:meta.phase,acquire:timing(),query:timing(),hold:timing(),mechanisms:{direct_pool_query:0,explicit_pool_connect:0,unknown:0}};stat.operations.set(key,row);}return row;}
          function consumerStats(stat,meta){const key=meta.consumer+"|"+meta.phase;let row=stat.consumers.get(key);if(!row){row={consumer:meta.consumer,phase:meta.phase,acquire:timing(),query:timing(),hold:timing(),mechanisms:{direct_pool_query:0,explicit_pool_connect:0,unknown:0}};stat.consumers.set(key,row);}return row;}
          function buildMeta(pool,mechanism,stack){const test=process.env.C40R1_SELF_TEST==="1"?testIdentityAls.getStore():null;const classified=test||classifyStack(stack),req=requestAls.getStore(),startedNs=process.hrtime.bigint();return{borrowerId:process.pid+"-"+(++lifecycle.borrowerSequence),pool,poolOwner:pool.__c40Stats?pool.__c40Stats.owner:"UNKNOWN_POOL",consumer:classified.consumer||"OTHER_UNKNOWN",operation:classified.operation||"other_unknown",mechanism,phase:phaseNow(),requestRoute:req&&req.route?req.route:"BACKGROUND",requestPhase:req&&req.phase?req.phase:null,startedNs,connectStartedNs:null,acquiredNs:null};}
