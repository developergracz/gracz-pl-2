          const fs = require("node:fs");
          const dir = "perf/k6/reports";
          const run = "b1-c40-r1-borrower-attribution-v100";
          const read = (p) => fs.existsSync(p) ? fs.readFileSync(p, "utf8") : "";
          const json = (p) => { try { return JSON.parse(read(p)); } catch { return null; } };
          const k = json(dir + "/" + run + "-k6-summary-export.json");
          const rec = json(dir + "/" + run + "-record.json");
          const correctnessReport = json(dir + "/" + run + "-correctness.json");
          const correctnessProbe = json(dir + "/" + run + "-correctness-probe.json");
          const metrics = k?.metrics || {};
          const vals = (name) => metrics?.[name]?.values || {};
          const trend = (name) => {
            const v = vals(name);
            return { p50: v.med ?? null, p90: v["p(90)"] ?? null, p95: v["p(95)"] ?? null, p99: v["p(99)"] ?? null, max: v.max ?? null };
          };
          const counter = (name) => Number(vals(name).count ?? 0);
          const rate = (name) => Number(vals(name).rate ?? 0);
          const loadRc = Number(read(dir + "/b1-c40-r1-load-rc.txt").trim() || -1);
          const executions = Number(read(dir + "/b1-c40-r1-load-executions.txt").trim() || 0);
          const phaseStatus = read(dir + "/b1-c40-r1-phase-status.txt");

          const attrLines = read(dir + "/" + run + "-attribution.jsonl").trim().split(/\n+/).filter(Boolean);
          const byPid = new Map();
          for (const line of attrLines) {
            try {
              const row = JSON.parse(line);
              const community = (row.owners || []).find((x) => x.owner === "COMMUNITY_POOL");
              const score = Number(community?.physicalAcquisitions || 0);
              const prev = byPid.get(row.pid);
              if (!prev || score >= prev.score) byPid.set(row.pid, { score, row });
            } catch {}
          }
          const selected = [...byPid.values()].sort((a,b) => b.score-a.score)[0]?.row || null;
          const community = selected?.owners?.find((x) => x.owner === "COMMUNITY_POOL") || null;
          const session = selected?.owners?.find((x) => x.owner === "SESSION_STORE_POOL") || null;

          const operations = community?.operations || [];
          const consumers = community?.consumers || [];
          const steadyOps = operations.filter((x) => x.phase === "steady").sort((a,b) => b.acquire.count-a.acquire.count);
          const steadyConsumers = consumers.filter((x) => x.phase === "steady").sort((a,b) => b.acquire.count-a.acquire.count);
          const classified = Number(community?.logicalBorrowers || 0);
          const physical = Number(community?.physicalAcquisitions || 0);
          const delta = classified - physical;

          const consumerTotals = ["LOBBY","GLOBAL_CHAT","OTHER_UNKNOWN"].map((consumer) => {
            const rows = consumers.filter((x) => x.consumer === consumer);
            const total = rows.reduce((n,x) => n + Number(x.acquire?.count || 0), 0);
            const steadyRows = rows.filter((x) => x.phase === "steady");
            const steady = steadyRows.reduce((n,x) => n + Number(x.acquire?.count || 0), 0);
            const steadyWaitMs = steadyRows.reduce((n,x) => n + Number(x.acquire?.totalMs || 0), 0);
            const steadyTiming = steadyRows[0]?.acquire || null;
            return {
              consumer, total, percentage: physical ? total*100/physical : 0,
              steady, steadyWaitMs, acquire: steadyTiming,
              steadyPercentage: steadyConsumers.reduce((n,x)=>n+Number(x.acquire?.count||0),0) ? steady*100/steadyConsumers.reduce((n,x)=>n+Number(x.acquire?.count||0),0) : 0
            };
          });

          const requestCounts = selected?.requestCounts || [];
          const requestAcquisitions = community?.requestAcquisitions || [];
          const requestCorrelation = requestCounts.map((r) => {
            const acq = requestAcquisitions.find((a) => a.phase === r.phase && a.route === r.route)?.count || 0;
            return { ...r, communityAcquisitions: acq, requestsPerSecond: r.phase === "steady" ? Number(r.count||0)/300 : null, acquisitionsPerRequest: r.count ? acq/r.count : null };
          }).sort((a,b) => b.communityAcquisitions-a.communityAcquisitions);

          const direct = Number(community?.mechanisms?.DIRECT_POOL_QUERY || 0);
          const explicit = Number(community?.mechanisms?.EXPLICIT_POOL_CONNECT || 0);
          const unknownMechanism = classified - direct - explicit;
          const timingKeys = ["p50Ms","p95Ms","p99Ms","maxMs"];
          const timingDelta = Object.fromEntries(timingKeys.map((key) => [key, Math.abs(Number(community?.acquire?.[key]||0)-Number(community?.physicalAcquire?.[key]||0))]));
          const timingCrossValidationPass = timingKeys.every((key) => timingDelta[key] <= Math.max(0.1, Number(community?.physicalAcquire?.[key]||0)*0.02));
          const countCrossValidationPass = delta === 0;
          const lobbyCreateRoute = requestCorrelation.find((x) => x.phase === "steady" && x.route === "POST /lobby/rooms");
          const semanticRoutePass = !lobbyCreateRoute || lobbyCreateRoute.acquisitionsPerRequest <= 1.05;
          const semanticSanity = {
            lobbyCreateRoute: lobbyCreateRoute || null,
            c25SingleAcquisitionConsistent: semanticRoutePass,
            impossibleOrderOfMagnitudeMultiplication: requestCorrelation.every((x) => !x.count || x.communityAcquisitions/x.count < 20),
            crossRequestLeakTest: phaseStatus?.includes("cross_context_leak_test=PASS") || false
          };

          const appCsv = read(dir + "/" + run + "-application.csv").trim().split(/\n+/).slice(1);
          let cpuMax=0,cpuSum=0,cpuN=0,rssMaxKb=0;
          for (const line of appCsv) {
            const p=line.split(",");
            if (p[5] === "PROCESS_DEAD") continue;
            const cpu=Number(p[2])||0,rss=Number(p[3])||0;
            cpuMax=Math.max(cpuMax,cpu); cpuSum+=cpu; cpuN+=1; rssMaxKb=Math.max(rssMaxKb,rss);
          }

          const obsLines = read(dir + "/" + run + "-observability-0.jsonl").trim().split(/\n+/).filter(Boolean);
          let heapUsedMax=0,heapTotalMax=0,eventLoopP99Max=0,activeRequestsMax=0;
          for (const line of obsLines) {
            try {
              const x=JSON.parse(line);
              heapUsedMax=Math.max(heapUsedMax,Number(x.heapUsed)||0);
              heapTotalMax=Math.max(heapTotalMax,Number(x.heapTotal)||0);
              eventLoopP99Max=Math.max(eventLoopP99Max,Number(x.eventLoopP99Ms)||0);
              activeRequestsMax=Math.max(activeRequestsMax,Number(x.activeRequests)||0);
            } catch {}
          }

          const pgCsv = read(dir + "/" + run + "-postgres.csv").trim().split(/\n+/);
          const pgHeader = pgCsv.length ? pgCsv[0].split(",") : [];
          const pgRows = pgCsv.slice(1).map((line) => line.split(",")).filter((p) => p.length >= pgHeader.length);
          const idx = (name) => pgHeader.indexOf(name);
          const maxCol = (name) => {
            const i=idx(name); if(i<0) return null;
            let m=0; for(const p of pgRows)m=Math.max(m,Number(p[i])||0); return m;
          };
          const lastCol = (name) => {
            const i=idx(name); if(i<0 || !pgRows.length) return null;
            return Number(pgRows.at(-1)[i])||0;
          };
          const pg = {
            numbackendsMax:maxCol("numbackends"),
            activeMax:maxCol("active"),
            idleMax:maxCol("idle"),
            idleInTransactionMax:maxCol("idle_in_transaction"),
            waitingMax:maxCol("waiting"),
            clientWaitMax:maxCol("client_wait"),
            lockWaitMax:maxCol("lock_wait"),
            lwlockWaitMax:maxCol("lwlock_wait"),
            ioWaitMax:maxCol("io_wait"),
            longQueriesMax:maxCol("long_queries"),
            maxQueryAgeMs:maxCol("max_query_ms"),
            maxTransactionAgeMs:maxCol("max_xact_ms"),
            waitingLocksMax:maxCol("waiting_locks"),
            deadlocksMax:maxCol("deadlocks"),
            tempFiles:lastCol("temp_files"),
            tempBytes:lastCol("temp_bytes")
          };

          const correctness = {
            correctnessExit: rec?.correctnessExit ?? null,
            unexpectedErrorRate: rate("wave_b_unexpected_error"),
            server5xxRate: rate("wave_b_server_5xx"),
            timeoutRate: rate("wave_b_timeout"),
            expected409: counter("wave_b_expected_409"),
            expected429: counter("wave_b_expected_429"),
            durabilityDuplicateVersionRevisionChecks: correctnessReport?.checks || null,
            globalDuplicateRateProbe: correctnessProbe || null
          };
          correctness.pass = correctness.correctnessExit === 0 &&
            correctness.unexpectedErrorRate < 0.01 &&
            correctness.server5xxRate < 0.001 &&
            correctness.timeoutRate < 0.01;

          const performance = {
            FAST: trend("wave_b_fast_read_ms"),
            NORMAL: trend("wave_b_normal_command_ms"),
            COMPLEX: trend("wave_b_complex_read_ms")
          };

          const preRunPass = [
            "identity=PASS","fixture=PASS","c38=PASS","c19=PASS","c22=PASS","c25=PASS","c27=PASS","c32=PASS",
            "profile=PASS","instrumentation=PASS","module_resolution=PASS","preload_smoke=PASS",
            "borrower_binding_self_test=PASS","queued_handoff_self_test=PASS","direct_query_self_test=PASS",
            "explicit_connect_self_test=PASS","classifier_self_test=PASS","cross_context_leak_test=PASS"
          ].every((x) => phaseStatus.includes(x));

          const evidenceValid = preRunPass && executions === 1 && (loadRc === 0 || loadRc === 99) &&
            Boolean(k) && Boolean(rec) && Boolean(community) && Boolean(session) &&
            community.configuredMax === 4 && session.configuredMax === 4 &&
            countCrossValidationPass && timingCrossValidationPass && semanticRoutePass &&
            semanticSanity.impossibleOrderOfMagnitudeMultiplication && correctness.pass;

          const steadyTotal = steadyConsumers.reduce((n,x)=>n+Number(x.acquire?.count||0),0);
          const steadyWaitTotal = steadyConsumers.reduce((n,x)=>n+Number(x.acquire?.totalMs||0),0);
          const steadySqlTotal = steadyOps.reduce((n,x)=>n+Number(x.query?.totalMs||0),0);
          const steadyHoldTotal = steadyOps.reduce((n,x)=>n+Number(x.hold?.totalMs||0),0);
          const steadyExplicit = steadyOps.reduce((n,x)=>n+Number(x.mechanisms?.EXPLICIT_POOL_CONNECT||0),0);
          const withDriver = (x) => {
            const waits=Number(x.acquire?.totalMs||0), sql=Number(x.query?.totalMs||0), hold=Number(x.hold?.totalMs||0), count=Number(x.acquire?.count||0);
            let pressureDriver = "COMBINATION";
            if (hold > waits && hold > sql) pressureDriver = "LONG_EXPLICIT_HOLD";
            else if (sql > 2*waits) pressureDriver = "LONG_SQL_EXECUTION";
            else if (Number(x.acquire?.p95Ms||0) > Number(community.acquire?.p95Ms||0)*1.5) pressureDriver = "LONG_ACQUISITION_WAIT";
            else if (steadyTotal && count/steadyTotal >= 0.20) pressureDriver = "HIGH_ACQUISITION_FREQUENCY";
            return {...x,pressureDriver,steadyAcquisitionsPerSecond:count/300};
          };
          const enrichedSteadyOps = steadyOps.map(withDriver);
          const rankedByWait = [...enrichedSteadyOps].sort((a,b)=>Number(b.acquire?.totalMs||0)-Number(a.acquire?.totalMs||0));
          const lobbySteady = consumerTotals.find((x)=>x.consumer==="LOBBY");
          const chatSteady = consumerTotals.find((x)=>x.consumer==="GLOBAL_CHAT");
          let rootCauseVerdict = "RC-C40R1-G — PRIMARY ROOT CAUSE NOT PROVEN";
          if (evidenceValid) {
            if (community.peakWaiting < 4 && Number(community.acquire?.p95Ms||0) < 50) rootCauseVerdict = "RC-C40R1-F — COMMUNITY POOL NOT PRIMARY AFTER VALID ATTRIBUTION";
            else if (steadyExplicit > 0 && steadyHoldTotal > steadyWaitTotal) rootCauseVerdict = "RC-C40R1-D — LONG EXPLICIT CHECKOUT/HOLD DOMINANT";
            else if (steadySqlTotal > 2*steadyWaitTotal && Number(community.query?.p95Ms||0) > 2*Number(community.acquire?.p95Ms||0)) rootCauseVerdict = "RC-C40R1-E — SQL EXECUTION LATENCY DOMINANT";
            else if (Number(lobbySteady?.steadyPercentage||0) >= 65) rootCauseVerdict = "RC-C40R1-A — LOBBY DOMINANT";
            else if (Number(chatSteady?.steadyPercentage||0) >= 65) rootCauseVerdict = "RC-C40R1-B — GLOBAL_CHAT DOMINANT";
            else if (Number(lobbySteady?.steady||0) > 0 && Number(chatSteady?.steady||0) > 0) rootCauseVerdict = "RC-C40R1-C — MULTIPLE COMMUNITY CONSUMERS JOINTLY SATURATE POOL";
          }
          const nextCorrectionTarget = evidenceValid && !rootCauseVerdict.includes("NOT PROVEN") && !rootCauseVerdict.includes("NOT PRIMARY")
            ? (rankedByWait[0]?.operation || null) : null;

          const output = {
            schema:"b1-c40-r1-analysis-v1",
            load:{executions,loadRc,evidenceValid,runnerInvocations:executions,v250:0,v500:0,v1000:0},
            correctness,
            performance,
            communityPhysical: community,
            sessionStoreControl: session ? {
              configuredMax:session.configuredMax,
              acquisitions:session.physicalAcquisitions,
              peakWaiting:session.peakWaiting,
              acquireP95Ms:session.acquire?.p95Ms,
              acquireP99Ms:session.acquire?.p99Ms,
              acquireMaxMs:session.acquire?.maxMs,
              queryP95Ms:session.query?.p95Ms,
              queryP99Ms:session.query?.p99Ms
            } : null,
            attribution:{
              consumerTotals,
              operations,
              steadyOperations:steadyOps,
              steadyConsumers,
              directVsExplicit:{
                directPoolQuery:direct,
                explicitPoolConnect:explicit,
                unknown:unknownMechanism,
                directPct:physical?direct*100/physical:0,
                explicitPct:physical?explicit*100/physical:0,
                acquisitionTiming:community?.mechanismAcquire || null,
                explicitHold:community?.hold || null
              },
              requestCorrelation,
              rankedByAcquisitionVolume: enrichedSteadyOps,
              rankedByTotalWaitContribution: rankedByWait,
              steadyTotals:{borrowers:steadyTotal,totalWaitMs:steadyWaitTotal,totalSqlMs:steadySqlTotal,totalExplicitHoldMs:steadyHoldTotal,explicitBorrowers:steadyExplicit}
            },
            accounting:{
              borrowerBoundAcquisitions:classified,
              physicalCommunityAcquisitions:physical,
              unattributedDelta:delta,
              countCrossValidationPass,
              borrowerTiming:community?.acquire || null,
              independentPhysicalTiming:community?.physicalAcquire || null,
              timingDelta,
              timingCrossValidationPass
            },
            semanticSanity,
            attributionValidity:evidenceValid?"ATTRIBUTION_VALID":"ATTRIBUTION_INVALID",
            rootCauseVerdict,
            nextCorrectionTarget,
            application:{
              cpuMaxPct:cpuMax,
              cpuMeanPct:cpuN?cpuSum/cpuN:null,
              rssMaxMb:rssMaxKb/1024,
              heapUsedMaxMb:heapUsedMax/1048576,
              heapTotalMaxMb:heapTotalMax/1048576,
              eventLoopP99MaxMs:eventLoopP99Max,
              activeRequestsMax
            },
            postgres:pg
          };
          fs.writeFileSync(dir + "/b1-c40-r1-analysis.json", JSON.stringify(output,null,2));
          console.log(JSON.stringify(output,null,2));
          NODE
          rc=$?
          echo "analysis_rc=$rc" >> perf/k6/reports/b1-c40-r1-phase-status.txt
          exit 0

      - name: Record CI identity and evidence checksums
        if: always()
        run: |
          set -euo pipefail
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "job_id=$GITHUB_JOB"
            echo "attempt=$GITHUB_RUN_ATTEMPT"
            echo "tested_head=$(git rev-parse HEAD)"
            echo "tested_tree=$(git rev-parse HEAD^{tree})"
          } > perf/k6/reports/b1-c40-r1-ci-identity.txt
          find perf/k6/reports -maxdepth 1 -type f ! -name b1-c40-r1-evidence-sha256.txt -print0 |
            sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/b1-c40-r1-evidence-sha256.txt"
          mv "$RUNNER_TEMP/b1-c40-r1-evidence-sha256.txt" perf/k6/reports/b1-c40-r1-evidence-sha256.txt

      - name: Upload exactly one final C40-R1 evidence artifact
        if: always()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: b1-c40-r1-borrower-attribution-evidence
          path: modern/checkers-engine/perf/k6/reports/
          if-no-files-found: error
          retention-days: 30

      - name: Truthful final C40-R1 evidence-validity gate
        if: always()
        run: |
          set -euo pipefail
          echo '--- C40 PHASE STATUS ---'
          cat perf/k6/reports/b1-c40-r1-phase-status.txt || true
          test "$(cat perf/k6/reports/b1-c40-r1-load-executions.txt 2>/dev/null || echo 0)" = "1" || { echo "B1-C40-R1 HOLD: benchmark not executed exactly once"; exit 92; }
          rc="$(cat perf/k6/reports/b1-c40-r1-load-rc.txt 2>/dev/null || echo -1)"
          test "$rc" = "0" -o "$rc" = "99" || { echo "B1-C40-R1 HOLD: invalid load exit $rc"; exit 93; }
          test -s perf/k6/reports/b1-c40-r1-analysis.json || { echo "B1-C40-R1 HOLD: analysis missing"; exit 94; }
          node - <<'NODE'
          const fs=require("node:fs");
          const x=JSON.parse(fs.readFileSync("perf/k6/reports/b1-c40-r1-analysis.json","utf8"));
          if(!x.load?.evidenceValid) process.exit(95);
          if(x.accounting?.unattributedDelta!==0) process.exit(96);
          if(!x.accounting?.timingCrossValidationPass) process.exit(97);
          if(x.attributionValidity!=="ATTRIBUTION_VALID") process.exit(98);
          console.log("B1-C40-R1 BORROWER ATTRIBUTION EVIDENCE VALID");
          console.log("classified="+x.accounting.classifiedCommunityAcquisitions);
          console.log("physical="+x.accounting.physicalCommunityAcquisitions);
          console.log("delta="+x.accounting.unattributedDelta);
          NODE
