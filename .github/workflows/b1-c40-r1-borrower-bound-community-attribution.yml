          function record(target,ms,error){const v=Number.isFinite(ms)?Math.max(0,ms):0;target.histogram.record(Math.max(1,Math.min(60_000_000,Math.round(v*1000))));target.totalMs+=v;if(error)target.errors+=1;}
          function snap(target){const h=target.histogram,c=Number(h.count||0);return{count:c,totalMs:target.totalMs,avgMs:c?target.totalMs/c:0,p50Ms:c?Number(h.percentile(50))/1000:0,p95Ms:c?Number(h.percentile(95))/1000:0,p99Ms:c?Number(h.percentile(99))/1000:0,maxMs:c?Number(h.max)/1000:0,errors:target.errors};}
          function ownerFromStack(stack){const s=String(stack||"");if(/\/src\/postgres-session-store\.js(?::|\))/u.test(s))return"SESSION_STORE_POOL";if(/\/src\/postgres-community-pool\.js(?::|\))/u.test(s))return"COMMUNITY_POOL";return null;}
          function functionNameFromStack(stack,file){const lines=String(stack||"").split("\n"),target="/src/"+file;let saw=false;for(let i=0;i<lines.length;i++){const line=String(lines[i]||"");if(!line.includes(target))continue;saw=true;const m=line.trim().match(/^at\s+(.+?)\s+\(/);if(m)return m[1];const next=String(lines[i+1]||"").trim();if(next&&!next.includes("/src/")){const n=next.match(/^at\s+(.+?)(?:\s+\(|$)/);if(n)return n[1];}}return saw?file+":anonymous":"unknown";}
          function classifyStack(stack){
            const s=String(stack||"");
            if(s.includes("/src/lobby.js")){
              const fn=functionNameFromStack(s,"lobby.js");
              if(fn.includes("#readStateDatabase")||fn.endsWith(".readState"))return{consumer:"LOBBY",operation:"lobby.read_state"};
              if(fn.includes("#touchUserDatabase")||fn.endsWith(".touchUser"))return{consumer:"LOBBY",operation:"lobby.presence_touch"};
              if(fn.includes("#listRoomsDatabase"))return{consumer:"LOBBY",operation:"lobby.rooms_read"};
              if(fn.includes("#listPlayersDatabase"))return{consumer:"LOBBY",operation:"lobby.players_read"};
              if(fn.includes("#listInvitationsDatabase"))return{consumer:"LOBBY",operation:"lobby.invitations_read"};
              if(fn.includes("#createRoomForActiveUserDatabase")||fn.includes("#createRoomDatabase"))return{consumer:"LOBBY",operation:"lobby.room_create_update_transaction"};
              if(fn.includes("#createInvitationDatabase")||fn.includes("respondInvitation"))return{consumer:"LOBBY",operation:"lobby.invitation_operations"};
              if(fn.includes("joinRoom")||fn.includes("#joinRoomDatabase")||fn.includes("#startGameDatabase"))return{consumer:"LOBBY",operation:"lobby.room_join_update_transaction"};
              if(fn.includes("#initializeDatabase"))return{consumer:"LOBBY",operation:"lobby.startup_schema"};
              return{consumer:"LOBBY",operation:"lobby.other:"+fn};
            }
            if(s.includes("/src/global-chat.js")||s.includes("/src/distributed-global-chat.js")){
              const fn=s.includes("/src/global-chat.js")?functionNameFromStack(s,"global-chat.js"):functionNameFromStack(s,"distributed-global-chat.js");
              if(fn.includes("#persistPresence")||fn.endsWith(".touch"))return{consumer:"GLOBAL_CHAT",operation:"global_chat.presence_touch"};
              if(fn.includes("#refreshPresence"))return{consumer:"GLOBAL_CHAT",operation:"global_chat.presence_read"};
              if(fn.includes("#notify"))return{consumer:"GLOBAL_CHAT",operation:"global_chat.realtime_notify"};
              if(fn.includes("#recoverSubscriber")||fn.includes("#readMessage"))return{consumer:"GLOBAL_CHAT",operation:"global_chat.background_realtime_refresh"};
