          if (lastThree.map(x => x.borrowerId).join(",") !== [cId,cId+1,cId+2].join(",")) process.exit(82);
          if (lastThree.map(x => x.consumer).join(",") !== "LOBBY,GLOBAL_CHAT,LOBBY") process.exit(83);
          if (new Set(lastThree.map(x => x.borrowerId)).size !== 3) process.exit(84);

          const callbackResult = await new Promise((resolve, reject) => {
