          const pool = makePool(hook.pg, process.env.DATABASE_URL);
          const stat = pool.__c40r1Stats;
          if (!stat || stat.owner !== "COMMUNITY_POOL" || pool.options.max !== 1) process.exit(72);

          const fromSource = (file, body) => new Function("pool", [
            "return " + body + ";",
            "//# sourceURL=" + path.join(root, "src", file)
          ].join("\n"))(pool);
          const lobbyExplicit = fromSource("lobby.js", "async function readState(){ return pool.connect(); }");
          const lobbyDirect = fromSource("lobby.js", "async function readState(){ return pool.query('select 1 as ok'); }");
          const chatDirect = fromSource("global-chat.js", "async function list(){ return pool.query('select 2 as ok'); }");
          const chatExplicit = fromSource("global-chat.js", "async function list(){ return pool.connect(); }");

          const a = await lobbyExplicit();
          const aId = a.__c40r1Meta.borrowerId;
          const bPromise = chatDirect();
          await delay(60);
          if (pool.waitingCount !== 1) process.exit(73);
          a.release();
          await bPromise;
          const firstTwo = hook.borrowerProof.slice(0, 2);
          if (firstTwo.length !== 2) process.exit(74);
          if (firstTwo[0].borrowerId !== aId || firstTwo[0].consumer !== "LOBBY") process.exit(75);
          if (firstTwo[1].consumer !== "GLOBAL_CHAT" || firstTwo[1].waitMs < 40) process.exit(76);
          if (firstTwo[0].borrowerId === firstTwo[1].borrowerId) process.exit(77);

