          function rawBorrowerEvent(kind,meta,extra){if(!borrowerLog||!meta)return;const row={kind,borrowerId:meta.borrowerId,poolOwner:meta.poolOwner,consumer:meta.consumer,operation:meta.operation,mechanism:meta.mechanism,phase:meta.phase,requestRoute:meta.requestRoute,...extra};fs.mkdirSync(path.dirname(borrowerLog),{recursive:true});fs.appendFileSync(borrowerLog,JSON.stringify(row)+"\n");}
          function finalizeBorrower(stat,meta,client,connectStartedNs){const now=process.hrtime.bigint(),waitMs=Number(now-meta.startedNs)/1e6,physicalWaitMs=Number(now-connectStartedNs)/1e6;meta.acquiredNs=now;stat.borrowerAcquisitions+=1;record(stat.acquire,waitMs,null);record(stat.physicalAcquire,physicalWaitMs,null);stat.mechanisms[meta.mechanism]=(stat.mechanisms[meta.mechanism]||0)+1;attachClientMeta(client,meta);if(stat.owner==="COMMUNITY_POOL"){const op=opStats(stat,meta),con=consumerStats(stat,meta);record(op.acquire,waitMs,null);record(con.acquire,waitMs,null);op.mechanisms[meta.mechanism]=(op.mechanisms[meta.mechanism]||0)+1;con.mechanisms[meta.mechanism]=(con.mechanisms[meta.mechanism]||0)+1;increment(stat.requestAcquisitions,meta.phase+"|"+meta.requestRoute,1);}rawBorrowerEvent("acquired",meta,{waitMs,physicalWaitMs});}
