          C40R1Pool.prototype.connect=function(callback){const stat=this.__c40Stats;if(!stat)return originalPoolConnect.apply(this,arguments);stat.peakWaiting=Math.max(stat.peakWaiting,Number(this.waitingCount||0));const existing=borrowerAls.getStore(),internalDirect=Boolean(existing&&existing.pool===this&&existing.mechanism==="direct_pool_query"),meta=internalDirect?existing:buildMeta(this,"explicit_pool_connect",new Error().stack);if(!internalDirect)rawBorrowerEvent("requested",meta,{});const connectStartedNs=process.hrtime.bigint();meta.connectStartedNs=connectStartedNs;if(typeof callback==="function"){return originalPoolConnect.call(this,(error,client,release)=>{if(error){stat.acquire.errors+=1;stat.physicalAcquire.errors+=1;rawBorrowerEvent("acquire_error",meta,{errorName:error.name||"Error"});return callback(error,client,release);}finalizeBorrower(stat,meta,client,connectStartedNs);const wrapped=internalDirect?release:wrapExplicitRelease(client,release,stat,meta);return callback(error,client,wrapped);});}let result;try{result=originalPoolConnect.call(this);}catch(error){stat.acquire.errors+=1;stat.physicalAcquire.errors+=1;rawBorrowerEvent("acquire_error",meta,{errorName:error.name||"Error"});throw error;}return result.then(client=>{finalizeBorrower(stat,meta,client,connectStartedNs);if(!internalDirect&&client&&typeof client.release==="function"){const originalRelease=client.release;client.release=wrapExplicitRelease(client,function(){client.release=originalRelease;return originalRelease.apply(client,arguments);},stat,meta);}return client;},error=>{stat.acquire.errors+=1;stat.physicalAcquire.errors+=1;rawBorrowerEvent("acquire_error",meta,{errorName:error.name||"Error"});throw error;});};
