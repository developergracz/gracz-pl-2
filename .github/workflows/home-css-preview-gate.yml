name: Homepage CSS compact — guarded mobile Lighthouse preview
on:
  pull_request:
    paths:
      - "maintenance-site/index.html"
      - "maintenance-site/assets/home-premium-max.min.css"
      - "maintenance-site/assets/home-premium-max.css"
      - "scripts/check-home-premium-css-compact.mjs"
      - "scripts/probe-home-critical-css.cjs"
      - ".github/workflows/home-css-preview-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  css-review:
    name: Equivalent CSS + SEO + mobile Lighthouse comparison
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - name: Verify source/compact asset and security/SEO invariants
        run: |
          node --check scripts/check-home-premium-css-compact.mjs
          node scripts/check-home-premium-css-compact.mjs
          node scripts/check-maintenance-seo.mjs
          node scripts/check-seo-auto-indexing.mjs
          node scripts/check-security-headers.mjs
      - name: Compare unchanged source stylesheet and compact stylesheet with local mobile Lighthouse
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/css-original"
          cp -a maintenance-site/. "$RUNNER_TEMP/css-original/"
          python3 - "$RUNNER_TEMP/css-original/index.html" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1])
          html=p.read_text()
          before='/assets/home-premium-max.min.css?v=compact-r1'
          after='/assets/home-premium-max.css?v=footer-layout-r1'
          assert html.count(before)==1
          p.write_text(html.replace(before,after))
          PY
          python3 -m http.server 4173 -d "$RUNNER_TEMP/css-original" --bind 127.0.0.1 > /tmp/gracz-original.log 2>&1 &
          PID1=$!
          python3 -m http.server 4174 -d maintenance-site --bind 127.0.0.1 > /tmp/gracz-compact.log 2>&1 &
          PID2=$!
          trap 'kill "$PID1" "$PID2" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:4173/ > /dev/null &&
               curl -sf http://127.0.0.1:4174/ > /dev/null; then break; fi
            sleep 1
          done
          mkdir -p "$RUNNER_TEMP/css-reports"
          for sample in 1 2; do
            for version in original compact; do
              port=4173
              [ "$version" = "compact" ] && port=4174
              npx --yes lighthouse@12.8.2 "http://127.0.0.1:$port/" \
                --quiet --only-categories=performance --output=json \
                --output-path="$RUNNER_TEMP/css-reports/$version-$sample.json" \
                --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
                --max-wait-for-load=20000
            done
          done
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import path from "node:path";
          const dir=process.env.RUNNER_TEMP+"/css-reports";
          const check=(kind)=>{
            const records=[1,2].map(i=>{
              const d=JSON.parse(fs.readFileSync(path.join(dir,kind+"-"+i+".json"),"utf8"));
              const lcp=d.audits?.["largest-contentful-paint"]?.numericValue;
              const cls=d.audits?.["cumulative-layout-shift"]?.numericValue;
              const url=kind==="compact"?
                "home-premium-max.min.css":"home-premium-max.css";
              const requests=d.audits?.["network-requests"]?.details?.items||[];
              if(!requests.some(x=>x.url?.includes("/assets/"+url+"?")&&x.statusCode===200))
                throw Error(kind+" stylesheet not loaded with HTTP 200");
              if(!Number.isFinite(lcp)||!Number.isFinite(cls))
                throw Error(kind+" Lighthouse metrics unavailable");
              return {lcp,cls};
            });
            return {records,lcp:records.reduce((s,x)=>s+x.lcp,0)/records.length,
              cls:records.reduce((s,x)=>s+x.cls,0)/records.length};
          };
          const original=check("original"),compact=check("compact");
          console.log(JSON.stringify({original,compact}));
          if(compact.lcp>original.lcp*1.15+100)
            throw Error("Compacted CSS increases mobile LCP beyond regression limit");
          if(compact.cls>original.cls+0.03)
            throw Error("Compacted CSS increases mobile layout shifting");
          JS

      - name: Preserve Lighthouse diagnostics for R2 review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-r2-lighthouse-diagnostics
          path: ${{ runner.temp }}/css-reports/compact-1.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Probe critical CSS in isolated local copies
        env:
          NODE_PATH: ${{ github.workspace }}/.critical-css-test/node_modules
        run: |
          npm install --no-save --prefix .critical-css-test @playwright/test@1.56.1
          node --check scripts/probe-home-critical-css.cjs
          node scripts/probe-home-critical-css.cjs
