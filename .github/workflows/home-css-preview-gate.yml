name: Homepage mobile Lighthouse — main vs PR regression guard
on:
  pull_request:
    paths:
      - "maintenance-site/index.html"
      - "maintenance-site/assets/home.css"
      - "maintenance-site/assets/home-r2.css"
      - "maintenance-site/assets/home-full-premium-r3.css"
      - "maintenance-site/assets/home-full-premium-r3-critical.css"
      - "maintenance-site/assets/home-full-premium-r3-detail.css"
      - "maintenance-site/assets/home-reference-r4.css"
      - "maintenance-site/assets/r4-reference-hero.webp"
      - "maintenance-site/assets/r4-reference-community.webp"
      - "maintenance-site/assets/r4-reference-newsletter.webp"
      - "maintenance-site/assets/r4-game-chess.webp"
      - "maintenance-site/assets/r4-game-checkers.webp"
      - "maintenance-site/assets/r4-game-gomoku.webp"
      - "maintenance-site/assets/r4-game-thousand.webp"
      - "maintenance-site/assets/r4-game-poker.webp"
      - "maintenance-site/assets/home.js"
      - "maintenance-site/assets/global-header-r1.css"
      - "maintenance-site/assets/legal-links.js"
      - "maintenance-site/assets/home-premium-max.min.css"
      - "maintenance-site/assets/home-premium-max.css"
      - "scripts/check-home-premium-css-compact.mjs"
      - ".github/workflows/home-css-preview-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  css-review:
    name: SEO + deterministic CSS + main-to-PR mobile regression check
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - name: Verify source/compact asset and security/SEO invariants
        run: |
          node --check scripts/check-home-premium-css-compact.mjs
          node scripts/check-home-premium-css-compact.mjs
          node scripts/check-maintenance-seo.mjs
          node scripts/check-seo-auto-indexing.mjs
          node scripts/check-security-headers.mjs
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const html=fs.readFileSync('maintenance-site/index.html','utf8');
          assert.equal(html.split('<h1 ').length-1,1,'One H1 only');
          assert.ok(html.includes('home-lcp-bundle-r1.css?v=css-lcp-20261030-sharp-r3'),'Verified homepage CSS bundle enabled');
          assert.ok(html.includes('gracz-hero-approved-r14.webp'),'Approved R14 hero image prioritized');
          assert.ok(html.includes('class="r4-shortcuts"'),'Five-item navigation present');
          assert.ok(html.includes('class="r4-games-grid"'),'Five card games present');
          assert.ok(html.includes('data-newsletter'),'Newsletter preserved');
          assert.ok(!html.includes('data-home-r3-detail'),'Obsolete R3 deferred CSS removed');
          const css=fs.readFileSync('maintenance-site/assets/home-reference-r4.css','utf8');
          for(const file of ['r4-reference-hero.webp','r4-reference-community.webp','r4-reference-newsletter.webp','r4-game-chess.webp','r4-game-checkers.webp','r4-game-gomoku.webp','r4-game-thousand.webp','r4-game-poker.webp']){
            assert.ok(css.includes(file),'CSS must use approved reference '+file);
            const bytes=fs.readFileSync('maintenance-site/assets/'+file);
            assert.ok(bytes.length>1000&&bytes.subarray(0,4).toString()==='RIFF','Valid WebP '+file);
          }
          JS
      - name: Compare current main and candidate PR in the same mobile Lighthouse environment
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          BASE_REF="${GITHUB_BASE_REF:-main}"
          mkdir -p "$RUNNER_TEMP/css-original"
          git fetch --no-tags --depth=1 origin "refs/heads/$BASE_REF"
          git archive FETCH_HEAD maintenance-site/ | tar -xf - -C "$RUNNER_TEMP/css-original"
          test -f "$RUNNER_TEMP/css-original/maintenance-site/index.html"
          # Both copies use the exact same local uncompressed server, so only
          # relative regressions are gated. Absolute LCP is NOT field CWV.
          python3 -m http.server 4173 -d "$RUNNER_TEMP/css-original/maintenance-site" --bind 127.0.0.1 > /tmp/gracz-original.log 2>&1 &
          PID1=$!
          python3 -m http.server 4174 -d maintenance-site --bind 127.0.0.1 > /tmp/gracz-compact.log 2>&1 &
          PID2=$!
          trap 'kill "$PID1" "$PID2" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:4173/ > /dev/null &&
               curl -sf http://127.0.0.1:4174/ > /dev/null; then break; fi
            sleep 1
          done
          mkdir -p "$RUNNER_TEMP/css-reports"
          for sample in 1 2; do
            for version in original compact; do
              port=4173
              [ "$version" = "compact" ] && port=4174
              npx --yes lighthouse@12.8.2 "http://127.0.0.1:$port/" \
                --quiet --only-categories=performance --output=json \
                --output-path="$RUNNER_TEMP/css-reports/$version-$sample.json" \
                --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
                --max-wait-for-load=20000
            done
          done
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import path from "node:path";
          const dir=process.env.RUNNER_TEMP+"/css-reports";
          const check=(kind)=>{
            const records=[1,2].map(i=>{
              const d=JSON.parse(fs.readFileSync(path.join(dir,kind+"-"+i+".json"),"utf8"));
              const lcp=d.audits?.["largest-contentful-paint"]?.numericValue;
              const cls=d.audits?.["cumulative-layout-shift"]?.numericValue;
              const urls=["home-premium-max.min.css","home-lcp-bundle-r1.css"];
              const requests=d.audits?.["network-requests"]?.details?.items||[];
              if(!requests.some(x=>urls.some(url=>x.url?.includes("/assets/"+url+"?"))&&x.statusCode===200))
                throw Error(kind+" stylesheet not loaded with HTTP 200");
              if(!Number.isFinite(lcp)||!Number.isFinite(cls))
                throw Error(kind+" Lighthouse metrics unavailable");
              return {lcp,cls};
            });
            return {records,lcp:records.reduce((s,x)=>s+x.lcp,0)/records.length,
              cls:records.reduce((s,x)=>s+x.cls,0)/records.length};
          };
          const original=check("original"),compact=check("compact");
          console.log("HOME_MAIN_VS_PR "+JSON.stringify({base:original,pr:compact,
            lcpDeltaMs:compact.lcp-original.lcp,clsDelta:compact.cls-original.cls}));
          if(compact.lcp>original.lcp*1.10+100)
            throw Error("PR mobile LCP regression exceeds 10% + 100ms noise allowance");
          if(compact.cls>original.cls+0.03)
            throw Error("PR mobile CLS regression exceeds 0.03");
          JS

      - name: Preserve Lighthouse diagnostics for R4 review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-r4-lighthouse-diagnostics
          path: ${{ runner.temp }}/css-reports/*.json
          if-no-files-found: ignore
          retention-days: 7
