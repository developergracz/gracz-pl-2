name: B1-C33 Focused AuthSession Identity Pool Validation

on:
  push:
    branches: [fix/wave-b-b1-c33-auth-session-identity-pool-sharing]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gracz_b1_c33
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d gracz_b1_c33"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: modern/checkers-engine

    env:
      B1_C33_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_b1_c33
      B1_C32_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_b1_c33
      B1_C31_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_b1_c33
      P1_C_01_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_b1_c33
      POSTGRES_POOL_BUDGET: '64'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Exact C32 ancestry and C33 scope
        run: |
          set -euo pipefail
          BASE=701f157fa7429fe845c90e5a69f774915e4bbb46
          TREE=1052c8481f66da072a1c168f10ed027dac507ba5
          test "$(git rev-parse ${BASE}^{tree})" = "$TREE"
          git merge-base --is-ancestor "$BASE" HEAD
          unexpected="$(git diff --name-only "$BASE" HEAD | grep -Ev '^(modern/checkers-engine/src/auth-sessions\.js|modern/checkers-engine/src/main\.js|modern/checkers-engine/src/postgres-pool-budget\.cjs|modern/checkers-engine/test/wave-b-b1-c32-cluster-aware-postgres-budget-guard\.test\.js|modern/checkers-engine/test/wave-b-b1-c33-auth-session-identity-pool-sharing\.test\.js|\.github/workflows/b1-c33-focused-validation\.yml)$' || true)"
          test -z "$unexpected"
          git diff --exit-code "$BASE" HEAD -- modern/checkers-engine/perf

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Static borrower and frozen-pool gate
        run: |
          set -euo pipefail
          node --check src/auth-sessions.js
          node --check src/main.js
          node --check src/postgres-pool-budget.cjs
          node --check test/wave-b-b1-c32-cluster-aware-postgres-budget-guard.test.js
          node --check test/wave-b-b1-c33-auth-session-identity-pool-sharing.test.js

          test "$(grep -Ec 'new[[:space:]]+(pg\.)?(Pool|Client)[[:space:]]*\(' src/auth-sessions.js || true)" -eq 0
          test "$(grep -Ec 'this\.pool\.end[[:space:]]*\(' src/auth-sessions.js || true)" -eq 0
          ! grep -Fq 'from "pg"' src/auth-sessions.js
          ! grep -Fq "from 'pg'" src/auth-sessions.js
          grep -Fq 'this.pool=pool;' src/auth-sessions.js
          grep -Fq 'new PostgresAuthSessionStore(baseAccounts.pool)' src/main.js

          test "$(grep -Ec 'new[[:space:]]+(pg\.)?Pool[[:space:]]*\(' src/secure-accounts.js || true)" -eq 0
          grep -Fq 'this.pool = baseService.pool;' src/secure-accounts.js

      - name: C33 real PostgreSQL identity ownership and auth correctness
        run: |
          node --require ./src/pg-secure-preload.cjs --test --test-concurrency=1 \
            test/wave-b-b1-c33-auth-session-identity-pool-sharing.test.js

      - name: C32 canonical profile and cluster guard regression
        run: |
          node --require ./src/pg-secure-preload.cjs --test --test-concurrency=1 \
            test/wave-b-b1-c32-cluster-aware-postgres-budget-guard.test.js

      - name: C31 identity pool regression
        run: |
          node --require ./src/pg-secure-preload.cjs --test --test-concurrency=1 \
            test/wave-b-b1-c31-secureaccounts-identity-pool-sharing.test.js

      - name: Authentication and session regressions
        run: |
          node --test --test-concurrency=1 \
            test/auth-session-registry.test.js \
            test/auth-lobby.test.js \
            test/accounts.test.js

      - name: Configuration and startup regressions
        run: |
          node --test --test-concurrency=1 test/config.test.js
          node --test --test-concurrency=1 test/p1-c-01-startup-concurrency.test.js

      - name: Final no-load scope gate
        run: |
          set -euo pipefail
          BASE=701f157fa7429fe845c90e5a69f774915e4bbb46
          git diff --exit-code "$BASE" HEAD -- perf
          test "$(grep -R -Eic '(^|[^[:alnum:]_])k6([^[:alnum:]_]|$)' .github/workflows/b1-c33-focused-validation.yml || true)" -eq 0
          test "$(grep -Ec 'new[[:space:]]+(pg\.)?(Pool|Client)[[:space:]]*\(' src/auth-sessions.js || true)" -eq 0
          grep -Fq 'new PostgresAuthSessionStore(baseAccounts.pool)' src/main.js
