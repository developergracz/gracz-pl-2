name: Publish OG image

on:
  push:
    branches: [main]
    paths:
      - 'maintenance-site/og-gracz-pl.jpg.b64'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode JPEG
        run: base64 -d maintenance-site/og-gracz-pl.jpg.b64 > maintenance-site/og-gracz-pl.jpg
      - name: Commit generated JPEG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maintenance-site/og-gracz-pl.jpg
          git diff --cached --quiet && exit 0
          git commit -m "chore(maintenance): publish OG image"
          git push
