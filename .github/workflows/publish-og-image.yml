name: Publish SEO images

on:
  push:
    branches: [main]
    paths:
      - 'maintenance-site/approved-maintenance.png'
      - '.github/workflows/publish-og-image.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Build optimized SEO images
        run: |
          convert maintenance-site/approved-maintenance.png \
            -auto-orient \
            -resize '1200x630^' \
            -gravity center \
            -extent 1200x630 \
            -strip \
            -quality 88 \
            maintenance-site/og-gracz-pl.jpg
          convert maintenance-site/approved-maintenance.png \
            -auto-orient \
            -strip \
            -quality 82 \
            maintenance-site/approved-maintenance.webp
          identify maintenance-site/og-gracz-pl.jpg
          identify maintenance-site/approved-maintenance.webp
      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maintenance-site/og-gracz-pl.jpg maintenance-site/approved-maintenance.webp
          git diff --cached --quiet && exit 0
          git commit -m "chore(maintenance): publish optimized SEO images"
          git push
