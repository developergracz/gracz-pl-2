name: Gomoku 1-to-1 console geometry agent
on:
  pull_request:
    paths:
      - 'contact-api/console-layout-agent/**'
      - 'contact-api/auth/gomoku-console.mjs'
      - 'contact-api/auth/checkers-console.mjs'
      - 'contact-api/auth/chess-console.mjs'
      - 'contact-api/auth/checkers-training-ui.mjs'
      - '.github/workflows/console-layout-parity.yml'
      - 'scripts/ci/checkers-change-scope.mjs'
      - 'scripts/ci/checkers-change-scope.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    name: Select safe CI scope
    runs-on: ubuntu-24.04
    outputs:
      targeted: ${{ steps.route.outputs.targeted }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Verify fail-closed CI selector
        run: node --test scripts/ci/checkers-change-scope.test.mjs
      - name: Select scoped PR test plan
        id: route
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$CI_EVENT" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$CI_BASE_SHA" || true
          fi
          node scripts/ci/checkers-change-scope.mjs
  geometry:
    needs: scope
    if: needs.scope.outputs.targeted != 'true'
    name: Measure Gomoku, Warcaby and Szachy in Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: contact-api/package-lock.json
      - name: Install existing project deps and pinned browser runner
        run: |
          npm --prefix contact-api ci --ignore-scripts --no-fund --no-audit
          npm --prefix contact-api install --no-save --no-package-lock --ignore-scripts --no-fund --no-audit playwright@1.58.2
          ./contact-api/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify zero-flash chess navigation in real Chromium (desktop + mobile)
        run: |
          node --test --test-name-pattern='cold navigation and refresh render no intermediate page' contact-api/scaling/chess-owner-console.browser.test.mjs
      - name: Measure 24 rendered consoles and 464 dynamic interaction steps
        run: |
          node --check contact-api/console-layout-agent/measure.mjs
          node --check contact-api/console-layout-agent/scenarios.mjs
          node contact-api/console-layout-agent/measure.mjs --strict
      - name: Publish screenshot and measurements evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gracz-console-parity-geometry
          path: contact-api/console-layout-agent/reports/
          if-no-files-found: warn
          retention-days: 7
