name: Gomoku 1-to-1 console geometry agent
on:
  pull_request:
    paths:
      - 'contact-api/console-layout-agent/**'
      - 'contact-api/auth/gomoku-console.mjs'
      - 'contact-api/auth/checkers-console.mjs'
      - 'contact-api/auth/chess-console.mjs'
      - '.github/workflows/console-layout-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry:
    name: Measure Gomoku, Warcaby and Szachy in Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: contact-api/package-lock.json
      - name: Install existing project deps and pinned browser runner
        run: |
          npm --prefix contact-api ci --ignore-scripts --no-fund --no-audit
          npm --prefix contact-api install --no-save --no-package-lock --ignore-scripts --no-fund --no-audit playwright@1.58.2
          ./contact-api/node_modules/.bin/playwright install --with-deps chromium
      - name: Validate and measure 24 rendered consoles (report-only)
        run: |
          node --check contact-api/console-layout-agent/measure.mjs
          node contact-api/console-layout-agent/measure.mjs
      - name: Publish screenshot and measurements evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gracz-console-parity-geometry
          path: contact-api/console-layout-agent/reports/
          if-no-files-found: warn
          retention-days: 7
