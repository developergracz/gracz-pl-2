name: CheckersEngine

on:
  pull_request:
    paths:
      - "modern/checkers-engine/**"
      - ".github/workflows/checkers-engine.yml"
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "modern/checkers-engine/**"
      - ".github/workflows/checkers-engine.yml"

permissions:
  contents: read

concurrency:
  group: checkers-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: modern/checkers-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-fund --no-audit
      - name: Static syntax checks
        run: npm run check
      - name: Unit and integration tests
        run: npm test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:browser
