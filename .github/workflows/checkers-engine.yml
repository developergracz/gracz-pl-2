name: CheckersEngine

on:
  pull_request:
    paths:
      - "modern/checkers-engine/**"
      - ".github/workflows/checkers-engine.yml"
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "modern/checkers-engine/**"
      - ".github/workflows/checkers-engine.yml"

permissions:
  contents: read

concurrency:
  group: checkers-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gracz
          POSTGRES_PASSWORD: gracz_test
          POSTGRES_DB: gracz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gracz -d gracz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      P1_C_01_DATABASE_URL: postgresql://gracz:gracz_test@127.0.0.1:5432/gracz_test
      P1_AUD3_03_DATABASE_URL: postgresql://gracz:gracz_test@127.0.0.1:5432/gracz_test
    defaults:
      run:
        working-directory: modern/checkers-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-fund --no-audit
      - name: Static syntax checks
        run: npm run check && node --check src/postgres-accounts.js
      - name: P1-AUD3-03 config contract tests
        run: node --test test/config.test.js
      - name: P1-AUD3-03 crypto key separation tests
        run: node --test test/p1-aud3-03-crypto-key-separation.test.js
      - name: P1-AUD3-03 PostgreSQL crypto persistence tests
        run: node --test test/p1-aud3-03-postgres-crypto.test.js
      - name: Unit and integration tests
        run: npm test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:browser
