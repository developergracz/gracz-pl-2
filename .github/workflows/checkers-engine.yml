name: CheckersEngine

on:
  pull_request:
    paths:
      - "modern/checkers-engine/**"
      - ".github/workflows/checkers-engine.yml"
  push:
    branches:
      - main
      - feature/checkers-engine-foundation
    paths:
      - "modern/checkers-engine/**"
      - ".github/workflows/checkers-engine.yml"

permissions:
  contents: read

concurrency:
  group: checkers-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modern/checkers-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: modern/checkers-engine/package.json
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
