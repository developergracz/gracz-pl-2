name: Maintenance SEO Gate

on:
  pull_request:
    paths:
      - "maintenance-site/**"
      - "contact-api/**"
      - "scripts/check-maintenance-seo.mjs"
      - "scripts/test-newsletter-maintenance-notice.mjs"
      - "scripts/test-footer-newsletter-premium-validation.mjs"
      - ".github/workflows/maintenance-seo.yml"
  push:
    branches:
      - main
    paths:
      - "maintenance-site/**"
      - "contact-api/**"
      - "scripts/check-maintenance-seo.mjs"
      - "scripts/test-newsletter-maintenance-notice.mjs"
      - "scripts/test-footer-newsletter-premium-validation.mjs"
      - ".github/workflows/maintenance-seo.yml"

permissions:
  contents: read

jobs:
  seo:
    name: Validate site SEO
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - name: Check contact scripts
        run: |
          node --check maintenance-site/assets/legal-links.js
          node --check maintenance-site/assets/contact-reply-premium.js
          node --check maintenance-site/assets/newsletter-full-max-r1.js
          node --check contact-api/server.mjs
          node --check contact-api/premium-reply.mjs
          node --check contact-api/newsletter.mjs
          node --check contact-api/persistence/newsletter-opt-in-store.mjs
          node --check contact-api/test/newsletter-route.test.mjs
          node --check contact-api/test-support/newsletter-provider.mjs
          node --check contact-api/integration/newsletter-opt-in.persistence.integration.test.mjs
          node --check contact-api/persistence/database.mjs
          node --check contact-api/persistence/migrator.mjs
          node --check contact-api/persistence/contact-data-contract-prep.mjs
          node --check contact-api/persistence/repositories.mjs
          node --check contact-api/persistence/memory-reply-token-store.mjs
          node --check contact-api/persistence/memory-idempotency-store.mjs
          node --check contact-api/persistence/memory-newsletter-consent-store.mjs
          node --check contact-api/routes/newsletter-route.mjs
          node --check contact-api/routes/premium-reply-route.mjs
          node --check contact-api/integration/persistence.integration.test.mjs
          node --check contact-api/integration/contact-data-contract-prep.integration.test.mjs
          node --check contact-api/integration/test-database-guard.mjs
          node --check contact-api/integration/premium-reply.persistence.integration.test.mjs
          node --check contact-api/integration/contact-idempotency.persistence.integration.test.mjs
      - name: Check complete backend syntax
        run: npm --prefix contact-api run check
      - name: Install backend dependencies
        run: npm --prefix contact-api ci --ignore-scripts --no-audit --no-fund
      - name: Run contact API regression tests
        run: npm --prefix contact-api test
      - name: Run maintenance revocation and Premium footer regressions
        run: node --test scripts/test-newsletter-maintenance-notice.mjs scripts/test-footer-newsletter-premium-validation.mjs
      - name: Run SEO gate
        run: node scripts/check-maintenance-seo.mjs
      - name: Run security headers and CSP gate
        run: node scripts/check-security-headers.mjs

  persistence:
    name: PostgreSQL ${{ matrix.postgres }} persistence gate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gracz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gracz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gracz_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - name: Verify isolated process-test hook support
        run: node --input-type=module -e "import { registerHooks } from 'node:module'; if (typeof registerHooks !== 'function') process.exit(1)"
      - name: Install persistence dependencies
        run: npm --prefix contact-api ci --ignore-scripts --no-audit --no-fund
      - name: Run PostgreSQL persistence integration tests
        run: npm --prefix contact-api run test:persistence
