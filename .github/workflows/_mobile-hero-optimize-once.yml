name: One-time mobile HERO optimization (PR #509)
on:
  push:
    branches:
      - perf/mobile-hero-lcp-image-r16-20261028
    paths:
      - .github/workflows/_mobile-hero-optimize-once.yml
permissions:
  contents: write
jobs:
  encode-image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Encode responsive image from the approved original
        run: |
          python -m pip install 'Pillow==11.3.0'
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          original=Path('maintenance-site/assets/gracz-hero-mobile-art-r14.webp')
          out=Path('maintenance-site/assets/gracz-hero-mobile-lcp-r16.webp')
          with Image.open(original) as image:
              image.load()
              print('Source:', image.size,original.stat().st_size)
              # Keep the same aspect ratio and picture; reduce only excessive source pixels.
              max_width=900
              if image.width > max_width:
                  image=image.resize((max_width,round(image.height*max_width/image.width)),Image.Resampling.LANCZOS)
              chosen=None
              for quality in [74,70,66,62,58]:
                  image.save(out,'WEBP',quality=quality,method=6)
                  print('Candidate quality',quality,'bytes',out.stat().st_size)
                  if out.stat().st_size <= 46_000:
                      chosen=quality
                      break
              if chosen is None:
                  raise SystemExit('No image at <=46 KB while maintaining quality >=58; no deployment')
              print('Optimized:',image.size,out.stat().st_size,'quality:',chosen)
              assert out.stat().st_size < original.stat().st_size*.8
              with Image.open(out) as optimized:
                  optimized.verify()
          PY
      - name: Commit optimized image to the isolated PR branch only
        run: |
          set -euo pipefail
          git config user.name 'gracz-lcp-optimizer[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add maintenance-site/assets/gracz-hero-mobile-lcp-r16.webp
          git diff --cached --quiet && exit 0
          git commit -m 'perf(home): add reduced-size approved mobile hero artwork'
          git push origin HEAD:perf/mobile-hero-lcp-image-r16-20261028
