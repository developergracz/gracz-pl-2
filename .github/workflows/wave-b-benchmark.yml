name: Advanced Scalability Wave B Correction Round 1

on:
  push:
    branches:
      - perf/advanced-scalability-wave-b
      - fix/wave-b-correction-round-1
    paths:
      - 'modern/checkers-engine/perf/**'
      - 'modern/checkers-engine/src/audit-service.js'
      - 'modern/checkers-engine/src/postgres-pool-budget.cjs'
      - 'modern/checkers-engine/test/wave-b-*.test.js'
      - '.github/workflows/wave-b-benchmark.yml'
  workflow_dispatch:
    inputs:
      failure_control:
        description: 'Intentional failure-propagation control; disabled for real benchmark runs'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  correction-round-1:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gracz_wave_b
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gracz_wave_b"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: modern/checkers-engine
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_wave_b
      WAVE_B_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_wave_b
      POSTGRES_POOL_BUDGET: '64'
      WAVE_B_SEED: '20260909'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Initialize evidence status
        run: |
          mkdir -p perf/k6/reports
          : > perf/k6/reports/phase-status.txt
      - name: Generate isolated masked benchmark secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in AUTH_SECRET MESSAGE_ENCRYPTION_KEY ATTACHMENT_ENCRYPTION_KEY MFA_ENCRYPTION_KEY; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Install application dependencies
        id: deps
        continue-on-error: true
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Setup k6
        id: k6setup
        continue-on-error: true
        uses: grafana/setup-k6-action@v1
      - name: Verify benchmark tools
        id: tools
        continue-on-error: true
        run: |
          set -euo pipefail
          command -v k6
          command -v psql
          command -v ss
          k6 version
          psql "$DATABASE_URL" -Atc 'SELECT version(); SHOW max_connections; SHOW shared_buffers; SHOW superuser_reserved_connections;'
      - name: Record bootstrap status
        if: always()
        run: |
          if [[ "${{ steps.deps.outcome }}" == success && "${{ steps.k6setup.outcome }}" == success && "${{ steps.tools.outcome }}" == success ]]; then
            echo 'bootstrap-tools=PASS' >> perf/k6/reports/phase-status.txt
          else
            echo 'bootstrap-tools=FAIL:TOOL_SETUP' >> perf/k6/reports/phase-status.txt
          fi
      - name: Validate correction harness syntax
        id: syntax
        if: ${{ steps.deps.outcome == 'success' && steps.k6setup.outcome == 'success' && steps.tools.outcome == 'success' }}
        continue-on-error: true
        run: |
          chmod +x perf/scripts/*.sh
          bash -n perf/scripts/wave-b-runner.sh
          bash -n perf/scripts/wave-b-sse-runner.sh
          bash -n perf/scripts/wave-b-cold-start.sh
          bash -n perf/scripts/wave-b-env-snapshot.sh
          bash -n perf/scripts/wave-b-postgres-sample.sh
          bash -n perf/scripts/wave-b-app-sample.sh
          node --check perf/scripts/wave-b-preflight.mjs
          node --check perf/scripts/wave-b-phase-gate.mjs
          node --check perf/scripts/wave-b-seed.mjs
          node --check perf/scripts/wave-b-correctness-probe.mjs
          node --check perf/scripts/wave-b-correctness-check.mjs
          node --check perf/scripts/wave-b-security-cardinality.mjs
          node --check perf/scripts/wave-b-sse-load.mjs
          node --check perf/scripts/wave-b-summarize.mjs
          node --check perf/k6/scenarios/_runner.js
          npm run check
      - name: Record syntax status
        if: always()
        run: |
          if [[ "${{ steps.syntax.outcome }}" == success ]]; then echo 'harness-syntax=PASS' >> perf/k6/reports/phase-status.txt; else echo 'harness-syntax=FAIL:VALIDATION' >> perf/k6/reports/phase-status.txt; fi
      - name: Focused production correction tests
        id: focused
        if: ${{ steps.syntax.outcome == 'success' }}
        continue-on-error: true
        run: node --test test/wave-b-correction-round-1.test.js test/wave-b-audit-init-postgres.test.js
      - name: Record focused tests status
        if: always()
        run: |
          if [[ "${{ steps.focused.outcome }}" == success ]]; then echo 'focused-production-tests=PASS' >> perf/k6/reports/phase-status.txt; else echo 'focused-production-tests=FAIL:REGRESSION' >> perf/k6/reports/phase-status.txt; fi
      - name: Intentional failure-propagation control
        if: ${{ inputs.failure_control == true && steps.focused.outcome == 'success' }}
        continue-on-error: true
        run: |
          echo 'intentional-failure-control=FAIL:97' >> perf/k6/reports/phase-status.txt
          exit 97
      - name: Multi-replica cold-start validation 1/2/4
        if: ${{ inputs.failure_control != true && steps.focused.outcome == 'success' }}
        continue-on-error: true
        run: |
          set +e
          overall=0
          reset_db(){ psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;' >/dev/null; }
          for replicas in 1 2 4; do
            reset_db
            run="cold-start-r${replicas}"
            WAVE_B_RUN_ID="$run" WAVE_B_REPLICAS="$replicas" WAVE_B_BASE_PORT=$((3400+replicas*10)) bash perf/scripts/wave-b-cold-start.sh
            rc=$?
            if [[ $rc -eq 0 ]]; then echo "$run=PASS" >> perf/k6/reports/phase-status.txt; else echo "$run=FAIL:$rc" >> perf/k6/reports/phase-status.txt; overall=1; fi
          done
          exit $overall
      - name: B2 PostgreSQL connection-budget gate
        if: ${{ inputs.failure_control != true && steps.focused.outcome == 'success' }}
        continue-on-error: true
        run: |
          set +e
          for replicas in 1 2 4; do
            run="b2-budget-r${replicas}"
            WAVE_B_RUN_ID="$run" WAVE_B_REPLICAS="$replicas" node perf/scripts/wave-b-preflight.mjs
            rc=$?
            if [[ $rc -eq 0 ]]; then echo "$run=PASS" >> perf/k6/reports/phase-status.txt
            elif [[ $rc -eq 42 ]]; then echo "$run=ENVIRONMENT_LIMITED:POSTGRES_CONNECTION_BUDGET" >> perf/k6/reports/phase-status.txt
            else echo "$run=FAIL:$rc" >> perf/k6/reports/phase-status.txt; fi
          done
          exit 0
      - name: B1 full steady-state 100/250/500/1000 VUs
        if: ${{ inputs.failure_control != true && steps.focused.outcome == 'success' }}
        continue-on-error: true
        run: |
          set +e
          overall=0
          reset_db(){ psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;' >/dev/null; }
          for vus in 100 250 500 1000; do
            reset_db
            run="b1-r1-v${vus}"
            WAVE_B_RUN_ID="$run" WAVE_B_REPLICAS=1 WAVE_B_VUS="$vus" WAVE_B_GAME_COUNT=50 WAVE_B_WARMUP_SECONDS=120 WAVE_B_STEADY_SECONDS=300 WAVE_B_COOLDOWN_SECONDS=120 WAVE_B_THINK_SECONDS=0.05 bash perf/scripts/wave-b-runner.sh
            rc=$?
            if [[ $rc -eq 0 ]]; then echo "$run=PASS" >> perf/k6/reports/phase-status.txt; else echo "$run=FAIL:$rc" >> perf/k6/reports/phase-status.txt; overall=1; fi
          done
          exit $overall
      - name: WA-06 retention and repeated-cardinality proof
        if: ${{ inputs.failure_control != true && steps.focused.outcome == 'success' }}
        continue-on-error: true
        run: |
          set +e
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;' >/dev/null
          WAVE_B_RUN_ID=wa06-cardinality-10000 WAVE_B_CARDINALITY=10000 WAVE_B_CARDINALITY_REPEAT=10000 WAVE_B_CARDINALITY_CONCURRENCY=25 node --expose-gc perf/scripts/wave-b-security-cardinality.mjs
          rc=$?
          if [[ $rc -eq 0 ]]; then echo 'wa06-cardinality-10000=PASS' >> perf/k6/reports/phase-status.txt; else echo "wa06-cardinality-10000=FAIL:$rc" >> perf/k6/reports/phase-status.txt; fi
          exit $rc
      - name: Mark prerequisite-limited mandatory phases
        if: ${{ always() && inputs.failure_control != true && steps.focused.outcome != 'success' }}
        run: |
          echo 'cold-start=NOT_EXECUTED:PREREQUISITE_FAILURE' >> perf/k6/reports/phase-status.txt
          echo 'b2-budget=NOT_EXECUTED:PREREQUISITE_FAILURE' >> perf/k6/reports/phase-status.txt
          echo 'b1=NOT_EXECUTED:PREREQUISITE_FAILURE' >> perf/k6/reports/phase-status.txt
          echo 'wa06=NOT_EXECUTED:PREREQUISITE_FAILURE' >> perf/k6/reports/phase-status.txt
      - name: Mark non-Round-1 phases not executed
        if: ${{ always() && inputs.failure_control != true }}
        run: |
          echo 'b3-final=NOT_EXECUTED:ROUND_1_STOP_RULE' >> perf/k6/reports/phase-status.txt
          echo 'b4=NOT_EXECUTED:ROUND_1_STOP_RULE' >> perf/k6/reports/phase-status.txt
          echo 'b5-final=NOT_EXECUTED:ROUND_1_STOP_RULE' >> perf/k6/reports/phase-status.txt
          echo 'b6=NOT_EXECUTED:ROUND_1_STOP_RULE' >> perf/k6/reports/phase-status.txt
          echo 'b7=NOT_EXECUTED:ROUND_1_STOP_RULE' >> perf/k6/reports/phase-status.txt
          echo 'b8=NOT_EXECUTED:ROUND_1_STOP_RULE' >> perf/k6/reports/phase-status.txt
          echo 'b9-full=NOT_EXECUTED:ROUND_1_STOP_RULE' >> perf/k6/reports/phase-status.txt
      - name: Summarize correction evidence
        if: always()
        run: |
          node perf/scripts/wave-b-summarize.mjs || true
          echo '--- PHASE STATUS ---'
          cat perf/k6/reports/phase-status.txt || true
      - name: Upload Wave B correction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave-b-correction-r1-${{ github.sha }}-${{ github.run_id }}
          path: modern/checkers-engine/perf/k6/reports/
          if-no-files-found: error
          retention-days: 30
      - name: Final truthful phase gate
        if: always()
        run: node perf/scripts/wave-b-phase-gate.mjs perf/k6/reports/phase-status.txt
