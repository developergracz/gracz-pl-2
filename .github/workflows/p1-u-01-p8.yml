name: P1-U-01 Canonical Game Types P8

on:
  push:
    branches:
      - fix/p1-u-01-canonical-game-types-p8
    paths:
      - modern/checkers-engine/src/game-types.js
      - modern/checkers-engine/src/lobby.js
      - modern/checkers-engine/src/rankings.js
      - modern/checkers-engine/src/tournaments.js
      - modern/checkers-engine/src/platform-lobby-http.js
      - modern/checkers-engine/test/p1-u-01-game-types-p8.test.js
      - .github/workflows/p1-u-01-p8.yml
  pull_request:
    branches: [main]
    paths:
      - modern/checkers-engine/src/game-types.js
      - modern/checkers-engine/src/lobby.js
      - modern/checkers-engine/src/rankings.js
      - modern/checkers-engine/src/tournaments.js
      - modern/checkers-engine/src/platform-lobby-http.js
      - modern/checkers-engine/test/p1-u-01-game-types-p8.test.js
      - .github/workflows/p1-u-01-p8.yml

permissions:
  contents: read
  security-events: write

jobs:
  p8-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gracz
          POSTGRES_PASSWORD: gracz_test
          POSTGRES_DB: gracz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gracz -d gracz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: modern/checkers-engine
    env:
      P1_C_01_DATABASE_URL: postgresql://gracz:gracz_test@127.0.0.1:5432/gracz_test
      P1_H_01_DATABASE_URL: postgresql://gracz:gracz_test@127.0.0.1:5432/gracz_test
      P1_AUD3_01_DATABASE_URL: postgresql://gracz:gracz_test@127.0.0.1:5432/gracz_test
      P1_AUD3_01_REQUIRE_POSTGRES: "1"
      P1_AUD3_03_DATABASE_URL: postgresql://gracz:gracz_test@127.0.0.1:5432/gracz_test
      P1_AUD3_04_DATABASE_URL: postgresql://gracz:gracz_test@127.0.0.1:5432/gracz_test
      P1_AUD3_07_DATABASE_URL: postgresql://gracz:gracz_test@127.0.0.1:5432/gracz_test
      P1_AUD3_07_REQUIRE_POSTGRES: "1"
      P1_U_02_DATABASE_URL: postgresql://gracz:gracz_test@127.0.0.1:5432/gracz_test
      P1_U_02_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts --no-fund --no-audit
      - name: P8 syntax and static checks
        run: npm run check && node --check src/game-types.js && node --check src/tournaments.js && node --check test/p1-u-01-game-types-p8.test.js
      - name: P8 focused canonical game type contract
        run: node --test test/p1-u-01-game-types-p8.test.js
      - name: Checkers regression
        run: node --test test/checkers-engine.test.js test/p1-c-01-postgres-cas.test.js test/p1-c-01-concurrent-http-postgres.test.js test/p1-c-01-http-conflict.test.js test/p1-c-01-http-success-regression.test.js
      - name: Gomoku regression
        run: node --test test/gomoku-service.test.js test/gomoku-multiplayer-http.test.js test/p1-aud3-04-gomoku-postgres.test.js test/p1-aud3-04-gomoku-http-concurrency.test.js
      - name: Thousand regression
        run: node --test test/thousand-engine.test.js test/thousand-service.test.js
      - name: Tournament concurrency regression
        run: node --test test/p1-h-01-tournament-concurrency.test.js
      - name: P5 readiness regression
        run: node --test test/p1-aud3-07-readiness.test.js test/p1-aud3-07-postgres-readiness.test.js test/p1-aud3-07-runtime-wiring.test.js
      - name: P6 distributed infrastructure regression
        run: node --test test/p1-aud3-01-shared-infrastructure.test.js test/p1-aud3-01-runtime-contract.test.js test/p1-aud3-01-p6-f01.test.js
      - name: P7 MatchRuntime regression
        run: node --test test/p1-u-02-match-runtime-postgres.test.js test/p1-u-02-checkers-runtime.test.js test/p1-u-02-p7-f01-privacy.test.js test/p1-u-02-p7-f02-projection-contract.test.js test/p1-u-02-p7-f03-current-replay.test.js test/p1-u-02-slice2-checkers-http.test.js
      - name: Full Node test suite
        run: npm test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser Checkers and Gomoku
        run: npm run test:browser

  p1-r-01-dr-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      source-postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      restore-postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: modern/checkers-engine
    env:
      P1_R_01_SOURCE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      P1_R_01_RESTORE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/postgres
      P1_R_01_REQUIRE_POSTGRES: "1"
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: P1-R-01 shell syntax
        run: bash -n ops/backup-postgres.sh ops/test-restore-postgres.sh ops/dr-restore-rehearsal.sh ops/test-dr-restore-program.sh
      - name: Verify isolated real PostgreSQL clusters
        run: |
          source_id="$(psql "$P1_R_01_SOURCE_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "SELECT system_identifier::text FROM pg_control_system();")"
          restore_id="$(psql "$P1_R_01_RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "SELECT system_identifier::text FROM pg_control_system();")"
          test -n "$source_id" && test -n "$restore_id" && test "$source_id" != "$restore_id"
      - name: P1-R-01 focused fail-closed DR regression
        run: bash ops/test-dr-restore-program.sh

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
