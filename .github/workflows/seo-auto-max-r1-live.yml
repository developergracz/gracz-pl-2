name: SEO AUTO MAX R2 - 24h Live Guardian

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-live:
    name: Hourly production SEO health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - name: Verify sitemap and public indexability
        run: |
          node --test scripts/test-seo-auto-indexing.mjs
          node scripts/check-seo-auto-indexing.mjs --live
