name: F03 Windows restore safety
on:
  pull_request:
    paths:
      - 'contact-api/operations/Restore-F03.ps1'
      - 'contact-api/test/restore-f03.windows.test.ps1'
      - '.github/workflows/f03-restore-windows.yml'
permissions:
  contents: read
jobs:
  isolated-restore:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download isolated PostgreSQL 18 binaries (no service install)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'pg18.zip'
          Invoke-WebRequest 'https://get.enterprisedb.com/postgresql/postgresql-18.6-5-windows-x64-binaries.zip' -OutFile $zip
          Expand-Archive $zip (Join-Path $env:RUNNER_TEMP 'pg18')
          & (Join-Path $env:RUNNER_TEMP 'pg18/pgsql/bin/pg_restore.exe') --version
      - name: Synthetic restore and safety regressions (no production credentials)
        shell: powershell
        run: |
          & ./contact-api/test/restore-f03.windows.test.ps1 -PgBin (Join-Path $env:RUNNER_TEMP 'pg18/pgsql/bin')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
