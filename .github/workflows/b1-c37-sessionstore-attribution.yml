name: B1-C37 SessionStore Shared-Pool Attribution
on:
  push:
    branches: [diag/wave-b-b1-c37-sessionstore-shared-pool-attribution]
    paths: ['.github/workflows/b1-c37-sessionstore-attribution.yml']
permissions:
  contents: read
jobs:
  b1-c37-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: gracz_wave_b}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d gracz_wave_b"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: modern/checkers-engine
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_wave_b
      WAVE_B_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_wave_b
      B1_C32_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_wave_b
      P1_C_01_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gracz_wave_b
      POSTGRES_POOL_BUDGET: '64'
      WAVE_B_SEED: '20260909'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Initialize evidence and secrets
        run: |
          set -euo pipefail
          mkdir -p perf/k6/reports
          : > perf/k6/reports/b1-c37-phase-status.txt
          for name in AUTH_SECRET MESSAGE_ENCRYPTION_KEY ATTACHMENT_ENCRYPTION_KEY MFA_ENCRYPTION_KEY; do
            value="$(openssl rand -hex 32)"; echo "::add-mask::$value"; echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Install dependencies
        id: deps
        continue-on-error: true
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install k6
        id: k6setup
        continue-on-error: true
        uses: grafana/setup-k6-action@v1
      - name: Verify tools and PostgreSQL fixture
        id: tools
        continue-on-error: true
        run: |
          set -euo pipefail
          command -v k6; command -v psql; command -v ss; k6 version
          test "$(psql "$DATABASE_URL" -Atc 'SHOW max_connections;')" = 100
          test "$(psql "$DATABASE_URL" -Atc 'SHOW superuser_reserved_connections;')" = 3
          psql "$DATABASE_URL" -Atc "SELECT version(); SHOW max_connections; SHOW reserved_connections; SHOW superuser_reserved_connections;" | tee perf/k6/reports/b1-c37-postgres-fixture.txt
      - name: Exact C36 source identity and C37-only scope
        id: identity
        if: steps.deps.outcome == 'success' && steps.k6setup.outcome == 'success' && steps.tools.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          BASE=9e927327cd7708b61775826b03b99ab2e5712a3d
          BASE_TREE=04ebe352ad0fe5288a08c370e7dd7df8f8d8c23f
          test "$(git rev-parse ${BASE}^{tree})" = "$BASE_TREE"
          git merge-base --is-ancestor "$BASE" HEAD
          unexpected="$(git diff --name-only "$BASE" HEAD | grep -Ev '^\.github/workflows/b1-c37-sessionstore-attribution\.yml$' || true)"
          test -z "$unexpected"
          git diff --exit-code "$BASE" HEAD -- src test perf .github/workflows/wave-b-benchmark.yml
          {
            echo repository=developergracz/gracz-pl-2
            echo source_branch=perf/wave-b-b1-c36-100vu-post-c35-revalidation
            echo source_head=$BASE
            echo source_tree=$BASE_TREE
            echo c37_branch=diag/wave-b-b1-c37-sessionstore-shared-pool-attribution
            echo tested_head=$(git rev-parse HEAD)
            echo tested_tree=$(git rev-parse HEAD^{tree})
            echo merge_base=$(git merge-base "$BASE" HEAD)
            echo ahead=$(git rev-list --count ${BASE}..HEAD)
            echo behind=$(git rev-list --count HEAD..${BASE})
          } | tee perf/k6/reports/b1-c37-identity.txt
      - name: Static shared-pool consumer inventory
        id: inventory
        if: steps.identity.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          {
            echo '=== DIRECT store.pool REFERENCES ==='; grep -RIn --include='*.js' 'store\.pool' src || true
            echo '=== OWNER ==='; grep -nE 'this\.pool = new Pool|this\.pool\.(query|connect)|acquireHealthClient\(this\.pool' src/postgres-session-store.js || true
            echo '=== LOBBY ==='; grep -nE 'this\.pool=pool|this\.pool\.(query|connect)|queryable\.query|client\.query' src/lobby.js || true
            echo '=== GLOBAL CHAT ==='; grep -nE 'this\.pool=pool|this\.pool\.(query|connect)|listenerClientFactory|LISTEN ' src/distributed-global-chat.js || true
            echo '=== CHECKERS DIRECT ==='; grep -nE 'store\.pool\.query|gracz_match_runtime_commands' src/server-p7.js || true
            echo '=== COMPOSITION ==='; grep -nE 'PostgresSessionStore|DistributedGlobalChatService|LobbyService|store\.pool' src/main.js || true
          } | tee perf/k6/reports/b1-c37-static-consumer-inventory.txt
      - name: C32 connection-budget regression
        id: c32
        if: steps.inventory.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          node --require ./src/pg-secure-preload.cjs --test --test-concurrency=1 test/wave-b-b1-c32-cluster-aware-postgres-budget-guard.test.js 2>&1 | tee perf/k6/reports/b1-c37-c32.log
      - name: Frozen C19 C22 C25 C27 regressions
        id: frozen
        if: steps.c32.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          node --require ./src/pg-secure-preload.cjs --test --test-concurrency=1 \
            test/wave-b-b1-c19-lobby-state-single-acquisition.test.js \
            test/wave-b-b1-c22-global-chat-listen-isolation.test.js \
            test/wave-b-b1-c25-lobby-room-single-acquisition.test.js \
            test/wave-b-b1-c27-global-chat-presence-single-acquisition.test.js 2>&1 | tee perf/k6/reports/b1-c37-frozen-regressions.log
      - name: Generate bounded C37 instrumentation
        id: instrumentation
        if: steps.frozen.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > "$RUNNER_TEMP/b1-c37-attribution-preload.cjs"
          echo '' | base64 -d | gzip -d > "$RUNNER_TEMP/b1-c37-selftest.mjs"
          node --check "$RUNNER_TEMP/b1-c37-attribution-preload.cjs"
          node --check "$RUNNER_TEMP/b1-c37-selftest.mjs"
          sha256sum "$RUNNER_TEMP/b1-c37-attribution-preload.cjs" "$RUNNER_TEMP/b1-c37-selftest.mjs" | tee perf/k6/reports/b1-c37-instrumentation-sha256.txt
      - name: Attribution self-test
        id: selftest
        if: steps.instrumentation.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          C37_ATTRIBUTION_ENABLE=1 C37_ATTRIBUTION_FILE=perf/k6/reports/b1-c37-selftest-attribution.json \
          NODE_OPTIONS="--require=$RUNNER_TEMP/b1-c37-attribution-preload.cjs" \
          node "$RUNNER_TEMP/b1-c37-selftest.mjs" 2>&1 | tee perf/k6/reports/b1-c37-selftest.log
      - name: Reset isolated DB
        id: reset
        if: steps.selftest.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;' | tee perf/k6/reports/b1-c37-reset.log
      - name: Execute exactly one diagnostic 100 VU run
        id: load
        if: steps.reset.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          echo 1 > perf/k6/reports/b1-c37-load-executions.txt
          set +e
          C37_ATTRIBUTION_ENABLE=1 NODE_OPTIONS="--require=$RUNNER_TEMP/b1-c37-attribution-preload.cjs" \
          WAVE_B_RUN_ID=b1-c37-sessionstore-attribution-v100 WAVE_B_REPLICAS=1 WAVE_B_VUS=100 \
          WAVE_B_GAME_COUNT=50 WAVE_B_WARMUP_SECONDS=120 WAVE_B_STEADY_SECONDS=300 WAVE_B_COOLDOWN_SECONDS=120 \
          WAVE_B_THINK_SECONDS=0.05 WAVE_B_SEED=20260909 WAVE_B_SCENARIO=mixed-platform \
          bash perf/scripts/wave-b-runner.sh
          rc=$?
          set -e
          echo "$rc" > perf/k6/reports/b1-c37-load-rc.txt
          echo diagnostic_load_rc=$rc >> perf/k6/reports/b1-c37-phase-status.txt
          exit 0
      - name: Mark load skipped
        if: always() && steps.load.outcome == 'skipped'
        run: |
          echo 0 > perf/k6/reports/b1-c37-load-executions.txt
          echo diagnostic_load=NOT_EXECUTED >> perf/k6/reports/b1-c37-phase-status.txt
      - name: Reconcile attribution
        id: reconcile
        if: steps.load.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require("node:fs"),dir="perf/k6/reports",run="b1-c37-sessionstore-attribution-v100";
          const ap=dir+"/"+run+"-c37-attribution-0.json",op=dir+"/"+run+"-observability-0.jsonl";
          if(!fs.existsSync(ap)||!fs.existsSync(op)) throw new Error("missing evidence");
          const a=JSON.parse(fs.readFileSync(ap,"utf8")),ls=fs.readFileSync(op,"utf8").trim().split(/\n+/),last=JSON.parse(ls.at(-1));
          const p=(last.pools||[]).filter(x=>String(x.label||"").includes("postgres-session-store.js|max=4"));
          if(p.length!==1) throw new Error("physical pool count="+p.length);
          const pool=p[0],pc=Number(pool.acquire?.count||0),cl=Number(a.totalAcquisitions||0);
          const sum=Object.values(a.consumers||{}).reduce((n,v)=>n+Number(v.acquisitions||0),0);
          if(sum!==cl||Number(a.physicalPool?.targetPoolCount)!==1||Number(a.physicalPool?.pools?.[0]?.configuredMax)!==4) throw new Error("accounting/integrity failure");
          const delta=cl-pc,unk=Number(a.consumers?.OTHER_UNKNOWN?.acquisitions||0);
          const out={schema:"b1-c37-reconciliation-v1",totalClassified:cl,physicalPoolAcquisitions:pc,
            unattributedDelta:delta,unattributedDeltaPercent:pc?Math.abs(delta)*100/pc:0,
            otherUnknown:unk,otherUnknownPercentOfPool:pc?unk*100/pc:0,configuredMax:pool.configuredMax,
            peakWaitingCountObserved:pool.maxWaitingCount,physicalAcquire:pool.acquire,physicalSql:pool.query,
            loadStartIso:a.loadStartIso||null,phases:a.phases||null,integrity:a.integrity,
            consumerBreakdown:Object.fromEntries(Object.entries(a.consumers||{}).map(([k,v])=>[k,{acquisitions:v.acquisitions,percentOfClassified:v.percent,directPoolQuery:v.directPoolQuery,explicitConnect:v.explicitConnect,acquisitionWait:v.acquisitionWait,sqlCount:v.sqlCount,sqlDuration:v.sqlDuration,explicitHold:v.explicitHold,phases:v.phases}])),
            topOperations:(a.operations||[]).slice(0,24),topSql:(a.sql||[]).slice(0,36),requestCorrelation:(a.requests||[]).slice(0,36)};
          fs.writeFileSync(dir+"/b1-c37-reconciliation.json",JSON.stringify(out,null,2)); console.log(JSON.stringify(out,null,2));
          NODE
      - name: Summarize Wave B evidence
        if: always()
        run: |
          node perf/scripts/wave-b-summarize.mjs || true
          cat perf/k6/reports/b1-c37-phase-status.txt || true
      - name: Upload one C37 evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1-c37-sessionstore-attribution-evidence
          path: modern/checkers-engine/perf/k6/reports/
          if-no-files-found: error
          retention-days: 30
      - name: Final C37 evidence-validity gate
        if: always()
        run: |
          set -euo pipefail
          test "$(cat perf/k6/reports/b1-c37-load-executions.txt)" = 1
          rc="$(cat perf/k6/reports/b1-c37-load-rc.txt)"
          test "$rc" = 0 -o "$rc" = 99
          test -s perf/k6/reports/b1-c37-sessionstore-attribution-v100-c37-attribution-0.json
          test -s perf/k6/reports/b1-c37-reconciliation.json
          test -s perf/k6/reports/b1-c37-c32.log
          test -s perf/k6/reports/b1-c37-frozen-regressions.log
          test -s perf/k6/reports/b1-c37-selftest.log
          echo 'B1-C37 diagnostic evidence valid; C36 remains canonical performance result.'
