<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 336 200" width="672" height="400" role="img" aria-label="Newsletter gracz.pl: Bądź na bieżąco z nowościami, turniejami i wydarzeniami">
  <image href="data:image/webp;base64," width="336" height="200" preserveAspectRatio="xMidYMid meet"/>
  <defs>
    <linearGradient id="display" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#061626" stop-opacity=".94"/><stop offset="1" stop-color="#071320" stop-opacity=".91"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#fff3b8"/><stop offset=".6" stop-color="#f2c869"/><stop offset="1" stop-color="#c88d39"/></linearGradient>
    <filter id="softGlow"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>
  <!-- Match the screen's perspective while retaining the original photo and laptop frame. -->
  <path d="M159 33 L328 20 L326 151 L136 160 Z" fill="url(#display)"/>
  <g font-family="Arial,'DejaVu Sans',sans-serif" text-anchor="middle">
    <text x="242" y="54" font-size="19" font-weight="800" fill="url(#gold)" transform="rotate(-3 242 54)">Newsletter</text>
    <g transform="rotate(-3 247 78)" font-size="16.4" font-weight="900">
      <text x="242" y="79" fill="#fff">gracz</text><text x="287" y="79" fill="#ed273c">.pl</text>
    </g>
    <g fill="none" stroke="#eebc63" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#softGlow)">
      <rect x="202" y="93" width="48" height="27" rx="3" transform="skewX(-9)"/>
    </g>
    <g fill="none" stroke="url(#gold)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M189 95 L241 91 L238 120 L187 122 Z"/>
      <path d="M190 96 L213 108 L240 92"/>
      <path d="M188 121 L206 106 M238 119 L222 106"/>
    </g>
    <g transform="rotate(2 231 141)">
      <text x="233" y="140" font-size="13.8" font-weight="800" fill="#ffe5a0">Bądź na bieżąco</text>
      <text x="233" y="153" font-size="10.3" font-weight="700" fill="#ffffff">z nowościami, turniejami</text>
      <text x="233" y="163" font-size="10.3" font-weight="700" fill="#ffffff">i wydarzeniami!</text>
    </g>
