<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en" xml:lang="en">
	<head>
		<title></title>
		<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />
		<style type="text/css" media="screen">
		html, body { height:100%; background-color: #e0e0ae;}
		body { margin:0; padding:0; overflow:hidden; text-align:center; }
		#flashContent { width:100%; height:100%; align:center;}
		</style>
		<script type="text/javascript" src="swfobject.js"></script>
		<script language="JavaScript">
			function initFP() {
				var flashvars = {};
				var params = { swliveconnect:"true", scale:"showall", bgcolor:"#e0e0ae", allowfullscreen:"true", allowscriptaccess:"sameDomain" };
				var attributes = { id:"flashContent", name:"gomoku" };
				swfobject.embedSWF("gomoku.swf", "myContent", "97%", "100%", "9.0.0", "expressInstall.swf", flashvars, params, attributes);
			}	
		</script>
	</head>
	<body onload="initFP();">
		<div id="myContent">
			
		</div>
	</body>
</html>
