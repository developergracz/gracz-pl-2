<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="pl" xml:lang="pl">
	<head>
		<title></title>
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
		<style type="text/css" media="screen">
		html, body { height:100%; background-color: #265752; background: #265752 url('ornament.png') repeat; margin:0; padding:0;}
		body { margin:0; padding:0; overflow:hidden; text-align:center; background: url('site-loader.gif') no-repeat center center;}
		#myContent { width:100%; height:100%; align:center;}
		</style>
		<script type="text/javascript" src="swfobject.js"></script>
		<script language="JavaScript">
			function initFP() {
				
				var flashvars = {};
				var params = { swliveconnect:"true", scale:"showall", bgcolor:"#265752", allowfullscreen:"true", allowscriptaccess:"sameDomain", wmode:"transparent" };
				var attributes = { id:"flashContent", name:"gomoku" };
				swfobject.embedSWF("gomoku.swf", "myContent", "100%", "100%", "9.0.0", "expressInstall.swf", flashvars, params, attributes, callbackFn);
				
			}	
			function callbackFn(e) { 
				if(!e.success) {
					var r=confirm("Gra do poprawnego działania wymaga oprogramowania Adobe Flash Player. Aby zainstalować, naciśnij OK.");
					if (r) {
						window.location.href = "http://get.adobe.com/pl/flashplayer/";
					}
				}
			}
		</script>
	</head>
	<body onload="initFP();">
		<div id="myContent">
			
		</div>
	</body>
</html>
